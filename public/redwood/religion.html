<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Religión · Redwood eTutor</title>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      :root {
        --rw-accent: #a63d3d;
        --rw-accent-d: #8b2e2e;
        --rw-sky: #fde8e4;
        --rw-sand: #fff6e8;
        --rw-leaf: #2d8a5e;
      }

      body {
        background: linear-gradient(165deg, var(--rw-sand) 0%, #fff 40%, var(--rw-sky) 100%);
        min-height: 100vh;
      }

      .wrap { max-width: 820px; margin: 0 auto; padding: 18px 16px 48px; }

      .top {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 22px;
      }
      .back {
        text-decoration: none; font-weight: 800; color: var(--rw-accent);
        font-size: .92rem; flex: none;
      }
      .back:hover { text-decoration: underline; }
      .brand-block { flex: 1; min-width: 200px; }
      .brand-block .mascot { font-size: 2rem; line-height: 1; margin-bottom: 6px; }
      .brand-block .lab-title {
        font-size: .78rem; font-weight: 800; letter-spacing: .06em;
        text-transform: uppercase; color: var(--rw-accent); margin-bottom: 4px;
      }
      .brand-block h1 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: clamp(1.35rem, 4.5vw, 1.75rem);
        line-height: 1.2; margin-bottom: 6px;
      }
      .brand-block .unit {
        color: var(--soft); font-weight: 700; font-size: .95rem;
      }

      .intro-card {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 22px;
        padding: 22px 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm);
        color: var(--ink); font-weight: 600; line-height: 1.6;
        font-size: 1.02rem;
      }

      .section-card {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 22px;
        padding: 22px 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
      }
      .section-card h2 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--navy); font-size: 1.15rem; margin-bottom: 10px;
        line-height: 1.3;
      }
      .section-card p {
        color: var(--ink); font-weight: 600; line-height: 1.6;
        font-size: 1rem;
      }

      .checklist-card {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 22px;
        padding: 22px 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm);
      }
      .checklist-card h2 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: 1.2rem; margin-bottom: 14px;
      }
      .checklist {
        list-style: none; margin: 0; padding: 0;
        display: flex; flex-direction: column; gap: 12px;
      }
      .check-item {
        display: flex; align-items: flex-start; gap: 12px;
        cursor: pointer; padding: 12px 14px; border-radius: 14px;
        border: 2px solid var(--line); background: var(--rw-sand);
        transition: background .15s, border-color .15s;
        font-weight: 700; color: var(--ink); line-height: 1.45;
        font-size: 1rem;
      }
      .check-item:hover { background: var(--rw-sky); border-color: #f0cfc7; }
      .check-item input {
        flex: none; width: 22px; height: 22px; margin-top: 2px;
        cursor: pointer; accent-color: var(--rw-leaf);
      }
      .check-item.done {
        background: #e8f8ef; border-color: rgba(45, 138, 94, .35);
      }
      .check-item.done .check-text { color: var(--rw-leaf); }

      .remember {
        padding: 18px 20px; border-radius: 18px;
        background: linear-gradient(135deg, #e8f8ef, #fff);
        border: 2px solid rgba(45, 138, 94, .35);
        color: var(--ink); font-weight: 700; line-height: 1.55;
        font-size: 1.02rem;
      }
      .remember::before {
        content: "💡 Recuerda: "; color: var(--rw-leaf); font-weight: 800;
      }
    </style>
    <link rel="stylesheet" href="./island-theme.css" />
  </head>
  <body class="rw-island-page">
    <div class="rw-island-scene" aria-hidden="true"></div>
    <div class="wrap">
      <header class="top">
        <a class="back" href="../dashboard.html">← Volver al panel</a>
        <div class="brand-block" id="header"></div>
      </header>

      <div class="intro-card" id="intro"></div>
      <div id="sections"></div>

      <div class="checklist-card">
        <h2>✅ Mi lista</h2>
        <ul class="checklist" id="checklist"></ul>
      </div>

      <div class="remember" id="remember" hidden></div>
    </div>

    <script src="./religion_content.js"></script>
    <script type="module">
      import { supabase } from "../js/supabase.js";

      const {
        data: { user },
        error: userError,
      } = await supabase.auth.getUser();

      if (userError || !user) {
        window.location.replace("../redwood-login.html");
      } else {
        const { data: profile } = await supabase
          .from("profiles")
          .select("has_access")
          .eq("id", user.id)
          .single();

        if (profile?.has_access !== true) {
          window.location.replace("../dashboard.html");
        } else {
      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      (function render() {
        const g = window.RELIGION_GUIDE;
        if (!g) {
          document.getElementById("intro").textContent =
            "La guía aún no se ha cargado.";
          return;
        }

        document.title = g.project + " · Redwood eTutor";

        document.getElementById("header").innerHTML = `
          <div class="mascot" aria-hidden="true">🌺🧩</div>
          <div class="lab-title">${escapeHtml(g.title || "Religión")}</div>
          <h1>${escapeHtml(g.project || "Proyecto de Religión")}</h1>
          <p class="unit">${escapeHtml(g.unit || "")}</p>
        `;

        document.getElementById("intro").textContent = g.intro || "";

        const sectionsEl = document.getElementById("sections");
        sectionsEl.innerHTML = "";
        (g.sections || []).forEach(function (sec) {
          const card = document.createElement("article");
          card.className = "section-card";
          card.innerHTML =
            "<h2>" + escapeHtml(sec.h) + "</h2>" +
            "<p>" + escapeHtml(sec.body) + "</p>";
          sectionsEl.appendChild(card);
        });

        const listEl = document.getElementById("checklist");
        listEl.innerHTML = "";
        (g.checklist || []).forEach(function (text, i) {
          const li = document.createElement("li");
          const label = document.createElement("label");
          label.className = "check-item";
          label.innerHTML =
            '<input type="checkbox" id="chk-' + i + '" />' +
            '<span class="check-text">' + escapeHtml(text) + "</span>";
          const input = label.querySelector("input");
          input.addEventListener("change", function () {
            label.classList.toggle("done", input.checked);
          });
          li.appendChild(label);
          listEl.appendChild(li);
        });

        if (g.remember) {
          const rem = document.getElementById("remember");
          rem.textContent = g.remember;
          rem.hidden = false;
        }
      })();
        }
      }
    </script>
  </body>
</html>
