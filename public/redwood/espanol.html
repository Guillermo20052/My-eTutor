<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Español · Ortografía · Redwood eTutor</title>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      :root {
        --rw-accent: #a63d3d;
        --rw-accent-d: #8b2e2e;
        --rw-sky: #fde8e4;
        --rw-sand: #fff6e8;
        --rw-leaf: #2d8a5e;
        --rw-ok: #1c9e6a;
        --rw-bad: #c0392b;
      }

      body {
        background: linear-gradient(165deg, var(--rw-sand) 0%, #fff 40%, var(--rw-sky) 100%);
        min-height: 100vh;
      }

      .wrap { max-width: 820px; margin: 0 auto; padding: 18px 16px 48px; }

      .top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
      }
      .back {
        text-decoration: none; font-weight: 800; color: var(--rw-accent);
        font-size: .92rem;
      }
      .back:hover { text-decoration: underline; }
      .brand-block { flex: 1; min-width: 180px; }
      .brand-block .mascot { font-size: 1.8rem; line-height: 1; }
      .brand-block h1 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: 1.35rem; margin-top: 4px;
      }
      .brand-block p { color: var(--soft); font-weight: 700; font-size: .88rem; }

      .scorebar {
        display: flex; gap: 10px; flex-wrap: wrap;
      }
      .scorebox {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 14px;
        padding: 8px 14px; text-align: center; min-width: 88px;
        box-shadow: var(--shadow-sm);
      }
      .scorebox .lbl {
        font-size: .68rem; font-weight: 800; color: var(--soft);
        text-transform: uppercase; letter-spacing: .06em;
      }
      .scorebox .val {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: 1.35rem; color: var(--rw-accent-d); line-height: 1.2;
      }

      .tabs {
        display: flex; gap: 8px; background: #fff; border: 2px solid #f0cfc7;
        border-radius: 16px; padding: 6px; margin-bottom: 18px;
        box-shadow: var(--shadow-sm);
      }
      .tabs button {
        flex: 1; border: 0; background: transparent; cursor: pointer;
        font-family: "Fredoka", sans-serif; font-weight: 600; color: var(--soft);
        padding: 11px 14px; border-radius: 11px; font-size: 1rem;
        transition: background .15s, color .15s;
      }
      .tabs button.active {
        background: linear-gradient(145deg, var(--rw-accent), var(--rw-accent-d));
        color: #fff; box-shadow: 0 6px 14px -8px rgba(139, 46, 46, .9);
      }
      .tabs button:not(.active):hover { background: var(--rw-sky); color: var(--rw-accent-d); }

      .panel { display: none; }
      .panel.on { display: block; }

      /* ---------- Estudiar ---------- */
      .lesson {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 22px;
        padding: 22px 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
      }
      .lesson .num {
        display: inline-block; font-size: .72rem; font-weight: 800;
        color: var(--rw-accent); background: var(--rw-sky);
        padding: 4px 10px; border-radius: 999px; margin-bottom: 8px;
      }
      .lesson h2 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: 1.25rem; margin-bottom: 4px;
      }
      .lesson .sub { color: var(--soft); font-weight: 700; font-size: .92rem; margin-bottom: 12px; }
      .lesson .intro {
        color: var(--ink); font-weight: 600; line-height: 1.55; margin-bottom: 14px;
      }
      .lesson .sec { margin-bottom: 12px; }
      .lesson .sec h3 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--navy); font-size: 1rem; margin-bottom: 4px;
      }
      .lesson .sec p { color: var(--ink); font-weight: 600; line-height: 1.55; font-size: .95rem; }
      .recuerda {
        margin-top: 14px; padding: 14px 16px; border-radius: 14px;
        background: linear-gradient(135deg, #e8f8ef, #fff);
        border: 2px solid rgba(45, 138, 94, .35);
        color: var(--ink); font-weight: 700; line-height: 1.5; font-size: .94rem;
      }
      .recuerda::before { content: "💡 Recuerda: "; color: var(--rw-leaf); font-weight: 800; }

      /* ---------- Jugar ---------- */
      .game-card {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 24px;
        padding: 24px 20px; box-shadow: var(--shadow-sm);
      }
      .mech-tag {
        display: inline-block; font-size: .74rem; font-weight: 800;
        color: var(--rw-accent); background: var(--rw-sky);
        padding: 5px 12px; border-radius: 999px; margin-bottom: 14px;
      }
      .prompt {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.2rem, 4vw, 1.55rem); color: var(--navy);
        text-align: center; line-height: 1.45; margin-bottom: 18px;
        word-break: break-word;
      }
      .prompt .blank {
        display: inline-block; min-width: 2ch;
        border-bottom: 3px solid var(--rw-accent); color: var(--rw-accent);
        padding: 0 4px;
      }

      .fill-row {
        display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .fill-row .input {
        max-width: 200px; text-align: center; font-size: 1.2rem;
        font-weight: 800; text-transform: lowercase;
      }
      .btn {
        font-family: "Fredoka", sans-serif; font-weight: 700; font-size: .95rem;
        border: 0; border-radius: 12px; padding: 11px 20px; cursor: pointer;
        background: linear-gradient(145deg, var(--rw-accent), var(--rw-accent-d));
        color: #fff; box-shadow: var(--shadow-sm);
      }
      .btn:disabled { opacity: .55; cursor: not-allowed; }
      .btn.ghost {
        background: #fff; color: var(--rw-accent-d);
        border: 2px solid #f0cfc7;
      }

      .chip-row {
        display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        margin-bottom: 8px;
      }
      .chip {
        font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.1rem;
        padding: 12px 18px; border-radius: 14px; cursor: pointer;
        border: 2px solid #f0cfc7; background: var(--rw-sand); color: var(--navy);
        transition: transform .12s, border-color .12s, background .12s;
      }
      .chip:hover:not(:disabled) {
        transform: translateY(-2px); border-color: var(--rw-accent);
        background: var(--rw-sky);
      }
      .chip:disabled { cursor: default; opacity: .7; }
      .chip.correct { background: #e8f8ef; border-color: var(--rw-ok); color: var(--rw-ok); }
      .chip.wrong { background: #fdecea; border-color: var(--rw-bad); color: var(--rw-bad); }

      .letter-row {
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        margin-bottom: 12px;
      }
      .letter-btn {
        width: 48px; height: 48px; font-family: "Fredoka", sans-serif;
        font-weight: 700; font-size: 1.25rem; border-radius: 12px;
        border: 2px solid #f0cfc7; background: #fff; cursor: pointer;
        color: var(--navy); transition: transform .12s, border-color .12s;
      }
      .letter-btn:hover:not(:disabled) {
        transform: scale(1.06); border-color: var(--rw-accent);
        background: var(--rw-sky);
      }
      .letter-btn:disabled { cursor: default; opacity: .75; }
      .letter-btn.correct { background: #e8f8ef; border-color: var(--rw-ok); color: var(--rw-ok); }
      .letter-btn.wrong { background: #fdecea; border-color: var(--rw-bad); color: var(--rw-bad); }

      .feedback {
        margin-top: 16px; padding: 14px 16px; border-radius: 14px;
        font-weight: 700; line-height: 1.5; text-align: center; display: none;
      }
      .feedback.show { display: block; }
      .feedback.good {
        background: #e8f8ef; border: 2px solid rgba(28, 158, 106, .4); color: #166534;
      }
      .feedback.bad {
        background: #fdecea; border: 2px solid rgba(192, 57, 43, .35); color: #922b21;
      }

      .loader {
        min-height: 70vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; text-align: center;
      }
      .loader .brand {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--navy); font-size: 1.5rem;
      }
      .loader .brand span { color: var(--rw-accent); }
      .spinner {
        width: 38px; height: 38px; border-radius: 50%;
        border: 4px solid var(--line); border-top-color: var(--rw-accent);
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #app[hidden], .loader[hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap loader" id="loading">
      <div class="brand">Redwood <span>eTutor</span></div>
      <div class="spinner" aria-hidden="true"></div>
      <p style="color:var(--soft);font-weight:800">Cargando Español…</p>
    </div>

    <div class="wrap" id="app" hidden>
      <header class="top">
        <a class="back" href="../dashboard.html">← Volver al panel</a>
        <div class="brand-block">
          <div class="mascot" aria-hidden="true">🌺📖</div>
          <h1>Español — Ortografía</h1>
          <p>Isla del aprendizaje · práctica sin fin</p>
        </div>
        <div class="scorebar" id="scorebar" hidden>
          <div class="scorebox">
            <div class="lbl">Sesión</div>
            <div class="val" id="session-score">0</div>
          </div>
          <div class="scorebox">
            <div class="lbl">Total</div>
            <div class="val" id="total-score">0</div>
          </div>
          <div class="scorebox">
            <div class="lbl">Racha</div>
            <div class="val" id="streak-val">0 🔥</div>
          </div>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" class="active" id="tab-study" role="tab" aria-selected="true">
          📚 Estudiar
        </button>
        <button type="button" id="tab-play" role="tab" aria-selected="false">
          🎮 Jugar
        </button>
      </nav>

      <section class="panel on" id="panel-study" role="tabpanel" aria-labelledby="tab-study">
        <div id="lessons"></div>
      </section>

      <section class="panel" id="panel-play" role="tabpanel" aria-labelledby="tab-play" hidden>
        <div class="game-card" id="game-area">
          <div class="mech-tag" id="mech-tag"></div>
          <div class="prompt" id="prompt"></div>
          <div id="interaction"></div>
          <div class="feedback" id="feedback" role="status"></div>
        </div>
      </section>
    </div>

    <script src="./espanol_content.js"></script>
    <script type="module">
      import { supabase } from "../js/supabase.js";

      const SUBJECT = "espanol";
      const MECH_LABELS = {
        fill: "Escribe la letra",
        tilde: "Pon la tilde",
        error: "Caza el error",
      };
      const MECHANICS = ["fill", "tilde", "error"];
      const ADVANCE_MS = 2200;

      let USER_ID = null;
      let totalScore = 0;
      let sessionScore = 0;
      let streak = 0;
      let lastItemKey = null;
      let answering = false;
      let currentRound = null;

      const $ = (id) => document.getElementById(id);

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      function updateScoreboard() {
        $("session-score").textContent = sessionScore;
        $("total-score").textContent = totalScore;
        $("streak-val").textContent = `${streak} 🔥`;
      }

      function buildData() {
        return {
          score: totalScore,
          sessionBest: sessionScore,
          streak,
          updatedAt: new Date().toISOString(),
        };
      }

      let saving = false;
      let dirty = false;

      async function saveProgress() {
        if (!USER_ID) return;
        dirty = true;
        if (saving) return;
        saving = true;
        try {
          while (dirty) {
            dirty = false;
            const data = buildData();
            const { error } = await supabase
              .from("progress")
              .upsert(
                {
                  user_id: USER_ID,
                  subject: SUBJECT,
                  data,
                  updated_at: new Date().toISOString(),
                },
                { onConflict: "user_id,subject" }
              );
            if (error) console.error("Error al guardar progreso:", error.message);
          }
        } finally {
          saving = false;
        }
      }

      async function loadProgress() {
        const { data: row } = await supabase
          .from("progress")
          .select("data")
          .eq("user_id", USER_ID)
          .eq("subject", SUBJECT)
          .maybeSingle();
        if (row?.data && Number.isFinite(row.data.score)) {
          totalScore = row.data.score;
        } else {
          totalScore = 0;
        }
        sessionScore = 0;
        streak = 0;
        updateScoreboard();
      }

      function renderLessons() {
        const root = $("lessons");
        root.innerHTML = "";
        const lessons = window.ESPANOL_LESSONS;
        if (!Array.isArray(lessons) || !lessons.length) {
          root.innerHTML =
            '<p style="text-align:center;color:var(--soft);font-weight:700">No hay lecciones cargadas.</p>';
          return;
        }
        for (const lesson of lessons) {
          const el = document.createElement("article");
          el.className = "lesson";
          const sections = (lesson.sections || [])
            .map(
              (s) =>
                `<div class="sec"><h3>${escapeHtml(s.h)}</h3><p>${escapeHtml(s.body)}</p></div>`
            )
            .join("");
          el.innerHTML = `
            <span class="num">Lección ${escapeHtml(lesson.num ?? lesson.id)}</span>
            <h2>${escapeHtml(lesson.title)}</h2>
            <p class="sub">${escapeHtml(lesson.subtitle || "")}</p>
            <p class="intro">${escapeHtml(lesson.intro || "")}</p>
            ${sections}
            ${lesson.recuerda ? `<div class="recuerda">${escapeHtml(lesson.recuerda)}</div>` : ""}
          `;
          root.appendChild(el);
        }
      }

      function itemKey(mech, idx) {
        return `${mech}:${idx}`;
      }

      function pickRound() {
        const bank = window.ESPANOL_BANK;
        if (!bank) return null;

        for (let attempt = 0; attempt < 30; attempt++) {
          const mech =
            MECHANICS[Math.floor(Math.random() * MECHANICS.length)];
          const pool = bank[mech];
          if (!Array.isArray(pool) || !pool.length) continue;

          const idx = Math.floor(Math.random() * pool.length);
          const key = itemKey(mech, idx);
          if (key === lastItemKey && pool.length > 1) continue;

          lastItemKey = key;
          return { mech, item: pool[idx], idx };
        }
        return null;
      }

      function showFeedback(ok, html) {
        const fb = $("feedback");
        fb.className = `feedback show ${ok ? "good" : "bad"}`;
        fb.innerHTML = html;
      }

      function awardCorrect() {
        let gained = 10;
        streak += 1;
        if (streak > 0 && streak % 3 === 0) gained += 5;
        sessionScore += gained;
        totalScore += gained;
        updateScoreboard();
        saveProgress();
      }

      function breakStreak() {
        streak = 0;
        updateScoreboard();
      }

      function scheduleNext() {
        setTimeout(() => {
          answering = false;
          startRound();
        }, ADVANCE_MS);
      }

      function renderFill(item) {
        const wrap = $("interaction");
        wrap.innerHTML = `
          <div class="fill-row">
            <input class="input" type="text" id="fill-input" autocomplete="off" spellcheck="false" maxlength="12" />
            <button type="button" class="btn" id="fill-submit">Comprobar</button>
          </div>
        `;
        const input = $("fill-input");
        const submit = $("fill-submit");
        const check = () => {
          if (answering) return;
          const raw = input.value.trim();
          if (!raw) return;
          answering = true;
          submit.disabled = true;
          input.disabled = true;

          const ans = raw.toLowerCase();
          const expected = String(item.answer ?? "").toLowerCase().trim();
          const ok =
            ans === expected ||
            (Array.isArray(item.accept) &&
              item.accept.some((a) => String(a).toLowerCase().trim() === ans));

          if (ok) {
            awardCorrect();
            let msg = "¡Correcto! +puntos";
            if (item.hint) msg += `<br>${escapeHtml(item.hint)}`;
            showFeedback(true, msg);
          } else {
            breakStreak();
            let msg = `No exactamente. La respuesta es <b>${escapeHtml(item.answer)}</b>.`;
            if (item.hint) msg += `<br>${escapeHtml(item.hint)}`;
            showFeedback(false, msg);
          }
          scheduleNext();
        };
        submit.addEventListener("click", check);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") check();
        });
        input.focus();
      }

      function renderTilde(item) {
        const wrap = $("interaction");
        const letters = Array.isArray(item.letters) ? item.letters : [];
        let html = '<div class="letter-row">';
        letters.forEach((ch, i) => {
          html += `<button type="button" class="letter-btn" data-idx="${i}">${escapeHtml(ch)}</button>`;
        });
        html += "</div>";
        if (item.answerIndex === -1) {
          html +=
            '<div style="text-align:center"><button type="button" class="btn ghost" id="tilde-none">Ninguna (sin tilde)</button></div>';
        }
        wrap.innerHTML = html;

        const finish = (picked, ok) => {
          if (answering) return;
          answering = true;
          wrap.querySelectorAll("button").forEach((b) => (b.disabled = true));
          if (picked) {
            picked.classList.add(ok ? "correct" : "wrong");
          }
          if (ok) {
            awardCorrect();
            let msg = "¡Correcto!";
            if (item.accented) msg += ` → <b>${escapeHtml(item.accented)}</b>`;
            if (item.why) msg += `<br>${escapeHtml(item.why)}`;
            showFeedback(true, msg);
          } else {
            breakStreak();
            let msg = "Incorrecto.";
            if (item.accented) msg += ` La forma correcta es <b>${escapeHtml(item.accented)}</b>.`;
            if (item.why) msg += `<br>${escapeHtml(item.why)}`;
            showFeedback(false, msg);
          }
          scheduleNext();
        };

        wrap.querySelectorAll(".letter-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.idx);
            finish(btn, idx === item.answerIndex);
          });
        });
        const noneBtn = $("tilde-none");
        if (noneBtn) {
          noneBtn.addEventListener("click", () => {
            finish(noneBtn, item.answerIndex === -1);
          });
        }
      }

      function renderError(item) {
        const wrap = $("interaction");
        const tokens = Array.isArray(item.tokens) ? item.tokens : [];
        let html = '<div class="chip-row">';
        tokens.forEach((tok, i) => {
          html += `<button type="button" class="chip" data-idx="${i}">${escapeHtml(tok)}</button>`;
        });
        html += "</div>";
        wrap.innerHTML = html;

        wrap.querySelectorAll(".chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            if (answering) return;
            answering = true;
            const idx = Number(chip.dataset.idx);
            const ok = idx === item.badIndex;
            wrap.querySelectorAll(".chip").forEach((c) => (c.disabled = true));
            chip.classList.add(ok ? "correct" : "wrong");

            if (ok) {
              awardCorrect();
              let msg = "¡Encontraste el error!";
              if (item.fixed) msg += ` → <b>${escapeHtml(item.fixed)}</b>`;
              if (item.hint) msg += `<br>${escapeHtml(item.hint)}`;
              showFeedback(true, msg);
            } else {
              breakStreak();
              let msg = "Esa palabra no es la incorrecta.";
              if (item.fixed) msg += ` La oración correcta: <b>${escapeHtml(item.fixed)}</b>`;
              if (item.hint) msg += `<br>${escapeHtml(item.hint)}`;
              showFeedback(false, msg);
            }
            scheduleNext();
          });
        });
      }

      function formatPrompt(text) {
        const safe = escapeHtml(text || "");
        return safe.replace(/_+/g, '<span class="blank">___</span>');
      }

      function startRound() {
        currentRound = pickRound();
        $("feedback").className = "feedback";
        $("feedback").innerHTML = "";

        if (!currentRound) {
          $("mech-tag").textContent = "Sin preguntas";
          $("prompt").textContent =
            "No hay banco de preguntas cargado todavía.";
          $("interaction").innerHTML = "";
          return;
        }

        const { mech, item } = currentRound;
        $("mech-tag").textContent = MECH_LABELS[mech] || mech;

        if (mech === "fill") {
          $("prompt").innerHTML = formatPrompt(item.prompt || item.q || "");
          renderFill(item);
        } else if (mech === "tilde") {
          $("prompt").textContent =
            item.prompt || item.word || "¿Qué letra lleva tilde?";
          renderTilde(item);
        } else {
          $("prompt").textContent =
            item.prompt || "Toca la palabra que está mal escrita:";
          renderError(item);
        }
      }

      function setupTabs() {
        const tabStudy = $("tab-study");
        const tabPlay = $("tab-play");
        const panelStudy = $("panel-study");
        const panelPlay = $("panel-play");

        tabStudy.addEventListener("click", () => {
          tabStudy.classList.add("active");
          tabPlay.classList.remove("active");
          tabStudy.setAttribute("aria-selected", "true");
          tabPlay.setAttribute("aria-selected", "false");
          panelStudy.classList.add("on");
          panelStudy.hidden = false;
          panelPlay.classList.remove("on");
          panelPlay.hidden = true;
        });

        tabPlay.addEventListener("click", () => {
          tabPlay.classList.add("active");
          tabStudy.classList.remove("active");
          tabPlay.setAttribute("aria-selected", "true");
          tabStudy.setAttribute("aria-selected", "false");
          panelPlay.classList.add("on");
          panelPlay.hidden = false;
          panelStudy.classList.remove("on");
          panelStudy.hidden = true;
          if (!answering && !currentRound) startRound();
        });
      }

      function setupAuthListener(uid) {
        supabase.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_OUT" || !session) {
            window.location.replace("../redwood-login.html");
            return;
          }
          if (session.user.id !== uid) {
            window.location.replace("../redwood-login.html");
          }
        });
      }

      (async () => {
        const {
          data: { user },
          error,
        } = await supabase.auth.getUser();
        if (error || !user) {
          window.location.replace("../redwood-login.html");
          return;
        }
        USER_ID = user.id;

        await loadProgress();
        renderLessons();
        setupTabs();
        $("scorebar").hidden = false;

        $("loading").hidden = true;
        $("app").hidden = false;

        setupAuthListener(USER_ID);
      })();
    </script>
