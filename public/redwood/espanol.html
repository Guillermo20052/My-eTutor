<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Español · Ortografía · Redwood eTutor</title>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      :root {
        --rw-accent: #a63d3d;
        --rw-accent-d: #8b2e2e;
        --rw-sky: #fde8e4;
        --rw-sand: #fff6e8;
        --rw-leaf: #2d8a5e;
        --rw-ok: #1c9e6a;
        --rw-bad: #c0392b;
      }

      body {
        background: linear-gradient(165deg, var(--rw-sand) 0%, #fff 40%, var(--rw-sky) 100%);
        min-height: 100vh;
      }

      .wrap { max-width: 820px; margin: 0 auto; padding: 18px 16px 48px; }

      .top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
      }
      .back {
        text-decoration: none; font-weight: 800; color: var(--rw-accent);
        font-size: .92rem;
      }
      .back:hover { text-decoration: underline; }
      .brand-block { flex: 1; min-width: 180px; }
      .brand-block .mascot { font-size: 1.8rem; line-height: 1; }
      .brand-block h1 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: 1.35rem; margin-top: 4px;
      }
      .brand-block p { color: var(--soft); font-weight: 700; font-size: .88rem; }

      .scorebar {
        display: flex; gap: 10px; flex-wrap: wrap;
      }
      .scorebox {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 14px;
        padding: 8px 14px; text-align: center; min-width: 88px;
        box-shadow: var(--shadow-sm);
      }
      .scorebox .lbl {
        font-size: .68rem; font-weight: 800; color: var(--soft);
        text-transform: uppercase; letter-spacing: .06em;
      }
      .scorebox .val {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: 1.35rem; color: var(--rw-accent-d); line-height: 1.2;
      }

      .tabs {
        display: flex; gap: 8px; background: #fff; border: 2px solid #f0cfc7;
        border-radius: 16px; padding: 6px; margin-bottom: 18px;
        box-shadow: var(--shadow-sm);
      }
      .tabs button {
        flex: 1; border: 0; background: transparent; cursor: pointer;
        font-family: "Fredoka", sans-serif; font-weight: 600; color: var(--soft);
        padding: 11px 14px; border-radius: 11px; font-size: 1rem;
        transition: background .15s, color .15s;
      }
      .tabs button.active {
        background: linear-gradient(145deg, var(--rw-accent), var(--rw-accent-d));
        color: #fff; box-shadow: 0 6px 14px -8px rgba(139, 46, 46, .9);
      }
      .tabs button:not(.active):hover { background: var(--rw-sky); color: var(--rw-accent-d); }

      .panel { display: none; }
      .panel.on { display: block; }

      .module-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 14px; margin-bottom: 8px;
      }
      .module-tile {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; min-height: 118px; padding: 16px 12px;
        border: 2px solid #f0cfc7; border-radius: 20px; background: #fff;
        box-shadow: var(--shadow-sm); cursor: pointer;
        font-family: "Fredoka", sans-serif; transition: transform .15s, border-color .15s, box-shadow .15s;
      }
      .module-tile:hover {
        transform: translateY(-3px); border-color: var(--rw-accent);
        box-shadow: 0 10px 24px -12px rgba(166, 61, 61, .35);
      }
      .module-tile .mod-emoji { font-size: 2rem; line-height: 1; }
      .module-tile .mod-title {
        font-weight: 700; font-size: .92rem; color: var(--rw-accent-d);
        text-align: center; line-height: 1.25;
      }
      .module-back, .game-nav a {
        display: inline-block; margin-bottom: 14px;
        text-decoration: none; font-weight: 800; color: var(--rw-accent); font-size: .92rem;
      }
      .module-back:hover, .game-nav a:hover { text-decoration: underline; }
      .game-nav { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
      .module-play-btn { width: 100%; margin-top: 8px; }

      /* ---------- Estudiar ---------- */
      .lesson {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 22px;
        padding: 22px 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
      }
      .lesson .num {
        display: inline-block; font-size: .72rem; font-weight: 800;
        color: var(--rw-accent); background: var(--rw-sky);
        padding: 4px 10px; border-radius: 999px; margin-bottom: 8px;
      }
      .lesson h2 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: 1.25rem; margin-bottom: 4px;
      }
      .lesson .sub { color: var(--soft); font-weight: 700; font-size: .92rem; margin-bottom: 12px; }
      .lesson .intro {
        color: var(--ink); font-weight: 600; line-height: 1.55; margin-bottom: 14px;
      }
      .lesson .sec { margin-bottom: 12px; }
      .lesson .sec h3 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--navy); font-size: 1rem; margin-bottom: 4px;
      }
      .lesson .sec p { color: var(--ink); font-weight: 600; line-height: 1.55; font-size: .95rem; }
      .recuerda {
        margin-top: 14px; padding: 14px 16px; border-radius: 14px;
        background: linear-gradient(135deg, #e8f8ef, #fff);
        border: 2px solid rgba(45, 138, 94, .35);
        color: var(--ink); font-weight: 700; line-height: 1.5; font-size: .94rem;
      }
      .recuerda::before { content: "💡 Recuerda: "; color: var(--rw-leaf); font-weight: 800; }

      /* ---------- Jugar ---------- */
      .game-card {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 24px;
        padding: 24px 20px; box-shadow: var(--shadow-sm);
      }
      .mech-tag {
        display: inline-block; font-size: .74rem; font-weight: 800;
        color: var(--rw-accent); background: var(--rw-sky);
        padding: 5px 12px; border-radius: 999px; margin-bottom: 10px;
      }
      .round-instruction {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.05rem, 3.8vw, 1.28rem); color: var(--rw-accent-d);
        text-align: center; line-height: 1.45; margin-bottom: 16px;
      }
      .prompt {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.2rem, 4vw, 1.55rem); color: var(--navy);
        text-align: center; line-height: 1.45; margin-bottom: 18px;
        word-break: break-word;
      }
      .fill-word-line {
        display: flex; align-items: center; justify-content: center;
        flex-wrap: wrap; gap: 6px;
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.5rem, 5vw, 2.1rem); color: var(--navy);
        line-height: 1.3;
      }
      .fill-part { white-space: nowrap; }
      .fill-blank-slot {
        display: inline-block; box-sizing: border-box;
        min-width: 36px; padding: 0 4px;
        border-bottom: 4px solid var(--rw-accent);
        color: var(--rw-accent-d); font-weight: 800;
        vertical-align: middle;
      }
      .btn {
        font-family: "Fredoka", sans-serif; font-weight: 700; font-size: .95rem;
        border: 0; border-radius: 12px; padding: 11px 20px; cursor: pointer;
        background: linear-gradient(145deg, var(--rw-accent), var(--rw-accent-d));
        color: #fff; box-shadow: var(--shadow-sm);
      }
      .btn:disabled { opacity: .55; cursor: not-allowed; }
      .btn.ghost {
        background: #fff; color: var(--rw-accent-d);
        border: 2px solid #f0cfc7;
      }

      .chip-row {
        display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        margin-bottom: 8px;
      }
      .chip {
        font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.1rem;
        padding: 12px 18px; border-radius: 14px; cursor: pointer;
        border: 2px solid #f0cfc7; background: var(--rw-sand); color: var(--navy);
        transition: transform .12s, border-color .12s, background .12s;
      }
      .chip:hover:not(:disabled) {
        transform: translateY(-2px); border-color: var(--rw-accent);
        background: var(--rw-sky);
      }
      .chip:disabled { cursor: default; opacity: .7; }
      .chip.correct { background: #e8f8ef; border-color: var(--rw-ok); color: var(--rw-ok); }
      .chip.wrong { background: #fdecea; border-color: var(--rw-bad); color: var(--rw-bad); }

      .letter-row {
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        margin-bottom: 12px;
      }
      .letter-btn {
        width: 48px; height: 48px; font-family: "Fredoka", sans-serif;
        font-weight: 700; font-size: 1.25rem; border-radius: 12px;
        border: 2px solid #f0cfc7; background: #fff; cursor: pointer;
        color: var(--navy); transition: transform .12s, border-color .12s;
      }
      .letter-btn:hover:not(:disabled) {
        transform: scale(1.06); border-color: var(--rw-accent);
        background: var(--rw-sky);
      }
      .letter-btn:disabled { cursor: default; opacity: .75; }
      .letter-btn.correct { background: #e8f8ef; border-color: var(--rw-ok); color: var(--rw-ok); }
      .letter-btn.wrong { background: #fdecea; border-color: var(--rw-bad); color: var(--rw-bad); }

      .signos-line {
        display: flex; align-items: center; justify-content: center;
        flex-wrap: wrap; gap: 8px;
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.2rem, 4vw, 1.55rem); color: var(--navy);
        line-height: 1.35;
      }
      .signos-sentence, .signos-part { text-align: center; white-space: nowrap; }
      .signos-input {
        box-sizing: border-box; width: 48px; height: 48px;
        border: 3px solid var(--rw-accent); border-radius: 12px;
        background: var(--rw-sky); color: var(--rw-accent-d);
        font-family: "Fredoka", sans-serif; font-weight: 800;
        font-size: 1.35rem; text-align: center; padding: 0;
      }
      .signos-input:focus {
        outline: 3px solid rgba(166, 61, 61, .35); outline-offset: 2px;
      }
      .signos-input:disabled { opacity: .65; }
      .signos-helpers {
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        margin-bottom: 14px;
      }
      .signos-helper-btn {
        min-width: 44px; height: 44px; padding: 0 10px;
        font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.25rem;
        border-radius: 12px; border: 2px solid #f0cfc7; background: #fff;
        cursor: pointer; color: var(--navy);
        transition: transform .12s, border-color .12s, background .12s;
      }
      .signos-helper-btn:hover:not(:disabled) {
        transform: scale(1.06); border-color: var(--rw-accent); background: var(--rw-sky);
      }
      .signos-helper-btn:disabled { opacity: .55; cursor: not-allowed; }
      .signos-submit-row {
        display: flex; justify-content: center;
      }

      .comma-words-line {
        display: flex; flex-wrap: wrap; align-items: center;
        justify-content: center; gap: 8px;
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.05rem, 3.6vw, 1.4rem); color: var(--navy);
        line-height: 1.4;
      }
      .comma-word-btn {
        font-family: inherit; font-weight: 700; font-size: inherit;
        padding: 10px 14px; border-radius: 14px; cursor: pointer;
        border: 2px solid #f0cfc7; background: var(--rw-sand); color: var(--navy);
        transition: transform .12s, border-color .12s, background .12s;
      }
      .comma-word-btn:hover:not(:disabled) {
        transform: translateY(-2px); border-color: var(--rw-accent); background: var(--rw-sky);
      }
      .comma-word-btn.comma-marked {
        background: var(--rw-sky); border-color: var(--rw-accent); color: var(--rw-accent-d);
      }
      .comma-word-btn:disabled { opacity: .7; cursor: default; }
      .comma-word-final { font-weight: 700; }

      .feedback {
        margin-top: 16px; padding: 14px 16px; border-radius: 14px;
        font-weight: 700; line-height: 1.5; text-align: center; display: none;
      }
      .feedback.show { display: block; }
      .feedback.good {
        background: #e8f8ef; border: 2px solid rgba(28, 158, 106, .4); color: #166534;
      }
      .feedback.bad {
        background: #fdecea; border: 2px solid rgba(192, 57, 43, .35); color: #922b21;
      }

      .loader {
        min-height: 70vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; text-align: center;
      }
      .loader .brand {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--navy); font-size: 1.5rem;
      }
      .loader .brand span { color: var(--rw-accent); }
      .spinner {
        width: 38px; height: 38px; border-radius: 50%;
        border: 4px solid var(--line); border-top-color: var(--rw-accent);
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #app[hidden], .loader[hidden] { display: none !important; }
    </style>
    <link rel="stylesheet" href="./island-theme.css" />
  </head>
  <body class="rw-island-page">
    <div class="rw-island-scene" aria-hidden="true"></div>
    <div class="wrap loader" id="loading">
      <div class="brand">Redwood <span>eTutor</span></div>
      <div class="spinner" aria-hidden="true"></div>
      <p style="color:var(--soft);font-weight:800">Cargando Español…</p>
    </div>

    <div class="wrap" id="app" hidden>
      <header class="top">
        <a class="back" href="../dashboard.html">← Volver al panel</a>
        <div class="brand-block">
          <div class="mascot" aria-hidden="true">🌺📖</div>
          <h1>Español — Ortografía</h1>
          <p>Isla del aprendizaje · práctica sin fin</p>
        </div>
        <div class="scorebar" id="scorebar" hidden>
          <div class="scorebox">
            <div class="lbl">Sesión</div>
            <div class="val" id="session-score">0</div>
          </div>
          <div class="scorebox">
            <div class="lbl">Total</div>
            <div class="val" id="total-score">0</div>
          </div>
          <div class="scorebox">
            <div class="lbl">Racha</div>
            <div class="val" id="streak-val">0 🔥</div>
          </div>
        </div>
      </header>

      <section class="panel on" id="view-modules">
        <div class="module-grid" id="module-grid"></div>
      </section>

      <section class="panel" id="view-module-study" hidden>
        <a href="#" class="module-back" id="back-to-modules">← Volver a los módulos</a>
        <div id="module-lesson"></div>
        <button type="button" class="btn module-play-btn" id="btn-start-module-game">🎮 Jugar</button>
      </section>

      <section class="panel" id="view-game" hidden>
        <nav class="game-nav">
          <a href="#" id="back-to-module-study">← Volver al módulo</a>
          <a href="#" id="back-to-modules-from-game">← Módulos</a>
        </nav>
        <div class="game-card" id="game-area">
          <div class="mech-tag" id="mech-tag"></div>
          <div class="round-instruction" id="round-instruction" hidden></div>
          <div class="prompt" id="prompt"></div>
          <div id="interaction"></div>
          <div class="feedback" id="feedback" role="status"></div>
        </div>
      </section>
    </div>

    <script src="./espanol_content.js"></script>
    <script type="module">
      import { supabase } from "../js/supabase.js";

      const SUBJECT = "espanol";
      const MECH_LABELS = {
        fill: "Elige la letra",
        tilde: "Pon la tilde",
        error: "Caza el error",
        signos: "Escribe los signos",
      };
      const MECHANICS = ["fill", "tilde", "error", "signos"];
      const ADVANCE_MS = 2200;

      let USER_ID = null;
      let totalScore = 0;
      let sessionScore = 0;
      let streak = 0;
      let selectedModule = null;
      let activeDeckModuleId = null;
      let moduleDeck = [];
      let deckIndex = 0;
      let lastDealtKey = null;
      let nextRoundTimer = null;
      let answering = false;
      let currentRound = null;

      const $ = (id) => document.getElementById(id);

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      function updateScoreboard() {
        $("session-score").textContent = sessionScore;
        $("total-score").textContent = totalScore;
        $("streak-val").textContent = `${streak} 🔥`;
      }

      function buildData() {
        return {
          score: totalScore,
          sessionBest: sessionScore,
          streak,
          updatedAt: new Date().toISOString(),
        };
      }

      let saving = false;
      let dirty = false;

      async function saveProgress() {
        if (!USER_ID) return;
        dirty = true;
        if (saving) return;
        saving = true;
        try {
          while (dirty) {
            dirty = false;
            const data = buildData();
            const { error } = await supabase
              .from("progress")
              .upsert(
                {
                  user_id: USER_ID,
                  subject: SUBJECT,
                  data,
                  updated_at: new Date().toISOString(),
                },
                { onConflict: "user_id,subject" }
              );
            if (error) console.error("Error al guardar progreso:", error.message);
          }
        } finally {
          saving = false;
        }
      }

      async function loadProgress() {
        const { data: row } = await supabase
          .from("progress")
          .select("data")
          .eq("user_id", USER_ID)
          .eq("subject", SUBJECT)
          .maybeSingle();
        if (row?.data && Number.isFinite(row.data.score)) {
          totalScore = row.data.score;
        } else {
          totalScore = 0;
        }
        sessionScore = 0;
        streak = 0;
        updateScoreboard();
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function deckEntryKey(entry) {
        return `${entry.mech}:${entry.idx}`;
      }

      function resolveModule(module) {
        if (!module?.id) return module;
        return (
          (window.ESPANOL_MODULES || []).find((m) => m.id === module.id) || module
        );
      }

      function buildModulePool(module) {
        const bank = window.ESPANOL_BANK;
        const mod = resolveModule(module);
        if (!bank || !mod) return [];
        const topics = new Set(mod.topics || []);
        if (!topics.size) return [];
        const pool = [];
        for (const mech of MECHANICS) {
          const items = bank[mech];
          if (!Array.isArray(items)) continue;
          items.forEach((item, idx) => {
            if (item?.topic && topics.has(item.topic)) {
              pool.push({ mech, item, idx });
            }
          });
        }
        return pool;
      }

      function resetModuleDeckState() {
        moduleDeck = [];
        deckIndex = 0;
        lastDealtKey = null;
        activeDeckModuleId = null;
      }

      function reshuffleModuleDeck(module) {
        const mod = resolveModule(module);
        activeDeckModuleId = mod?.id ?? null;
        moduleDeck = shuffle(buildModulePool(mod));
        if (
          moduleDeck.length > 1 &&
          lastDealtKey &&
          deckEntryKey(moduleDeck[0]) === lastDealtKey
        ) {
          [moduleDeck[0], moduleDeck[1]] = [moduleDeck[1], moduleDeck[0]];
        }
        deckIndex = 0;
      }

      function dealNextRound() {
        const mod = resolveModule(selectedModule);
        if (!mod) return null;

        if (activeDeckModuleId !== mod.id || !moduleDeck.length) {
          const pool = buildModulePool(mod);
          if (!pool.length) return null;
          lastDealtKey = null;
          reshuffleModuleDeck(mod);
        } else if (deckIndex >= moduleDeck.length) {
          lastDealtKey = deckEntryKey(moduleDeck[moduleDeck.length - 1]);
          reshuffleModuleDeck(mod);
        }

        const entry = moduleDeck[deckIndex++];
        lastDealtKey = deckEntryKey(entry);
        return { mech: entry.mech, item: entry.item };
      }

      function cancelScheduledRound() {
        if (nextRoundTimer) {
          clearTimeout(nextRoundTimer);
          nextRoundTimer = null;
        }
      }

      function showView(name) {
        if (name !== "game") cancelScheduledRound();
        const views = {
          modules: $("view-modules"),
          study: $("view-module-study"),
          game: $("view-game"),
        };
        for (const [key, el] of Object.entries(views)) {
          el.hidden = key !== name;
          el.classList.toggle("on", key === name);
        }
        $("scorebar").hidden = name !== "game";
      }

      function lessonHtml(lesson) {
        const sections = (lesson.sections || [])
          .map(
            (s) =>
              `<div class="sec"><h3>${escapeHtml(s.h)}</h3><p>${escapeHtml(s.body)}</p></div>`
          )
          .join("");
        return `
          <article class="lesson">
            <span class="num">Lección ${escapeHtml(lesson.num ?? lesson.id)}</span>
            <h2>${escapeHtml(lesson.title)}</h2>
            <p class="sub">${escapeHtml(lesson.subtitle || "")}</p>
            <p class="intro">${escapeHtml(lesson.intro || "")}</p>
            ${sections}
            ${lesson.recuerda ? `<div class="recuerda">${escapeHtml(lesson.recuerda)}</div>` : ""}
          </article>
        `;
      }

      function findLesson(lessonId) {
        return (window.ESPANOL_LESSONS || []).find((l) => l.id === lessonId);
      }

      function renderModuleList() {
        const root = $("module-grid");
        root.innerHTML = "";
        const modules = window.ESPANOL_MODULES || [];
        if (!modules.length) {
          root.innerHTML =
            '<p style="text-align:center;color:var(--soft);font-weight:700">No hay módulos cargados.</p>';
          return;
        }
        for (const mod of modules) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "module-tile";
          btn.innerHTML = `<span class="mod-emoji">${mod.emoji || "📘"}</span><span class="mod-title">${escapeHtml(mod.title)}</span>`;
          btn.addEventListener("click", () => openModuleStudy(mod));
          root.appendChild(btn);
        }
      }

      function openModuleStudy(module) {
        const mod = resolveModule(module);
        if (selectedModule?.id !== mod?.id) {
          resetModuleDeckState();
          currentRound = null;
        }
        selectedModule = mod;
        const lesson = findLesson(mod.lesson);
        const root = $("module-lesson");
        if (!lesson) {
          root.innerHTML =
            '<p style="text-align:center;color:var(--soft);font-weight:700">No hay lección para este módulo.</p>';
        } else {
          root.innerHTML = lessonHtml(lesson);
        }
        showView("study");
      }

      function startModuleGame() {
        if (!selectedModule) return;
        cancelScheduledRound();
        lastDealtKey = null;
        reshuffleModuleDeck(selectedModule);
        answering = false;
        currentRound = null;
        showView("game");
        startRound();
      }

      function setupNavigation() {
        $("back-to-modules").addEventListener("click", (e) => {
          e.preventDefault();
          showView("modules");
        });
        $("back-to-modules-from-game").addEventListener("click", (e) => {
          e.preventDefault();
          showView("modules");
        });
        $("back-to-module-study").addEventListener("click", (e) => {
          e.preventDefault();
          if (selectedModule) openModuleStudy(selectedModule);
        });
        $("btn-start-module-game").addEventListener("click", startModuleGame);
      }

      function showFeedback(ok, html) {
        const fb = $("feedback");
        fb.className = `feedback show ${ok ? "good" : "bad"}`;
        fb.innerHTML = html;
      }

      function awardCorrect() {
        let gained = 10;
        streak += 1;
        if (streak > 0 && streak % 3 === 0) gained += 5;
        sessionScore += gained;
        totalScore += gained;
        updateScoreboard();
        saveProgress();
      }

      function breakStreak() {
        streak = 0;
        updateScoreboard();
      }

      function scheduleNext() {
        cancelScheduledRound();
        nextRoundTimer = setTimeout(() => {
          nextRoundTimer = null;
          answering = false;
          startRound();
        }, ADVANCE_MS);
      }

      function showRoundInstruction(mech, item) {
        const el = $("round-instruction");
        const text = item?.ask || window.ESPANOL_UI?.[mech];
        if (text) {
          el.textContent = text;
          el.hidden = false;
        } else {
          el.hidden = true;
        }
      }

      function renderFillPrompt(item) {
        const prompt = item.prompt || item.q || "";
        const u = prompt.indexOf("_");
        const before = u >= 0 ? prompt.slice(0, u) : prompt;
        const after = u >= 0 ? prompt.slice(u + 1) : "";
        $("prompt").innerHTML = `
          <div class="fill-word-line">
            <span class="fill-part">${escapeHtml(before)}</span>
            <span class="fill-blank-slot" aria-hidden="true">_</span>
            <span class="fill-part">${escapeHtml(after)}</span>
          </div>
        `;
      }

      function renderFill(item) {
        const wrap = $("interaction");
        const options = Array.isArray(item.options) ? item.options : [];
        let html = '<div class="letter-row">';
        options.forEach((opt) => {
          html += `<button type="button" class="letter-btn">${escapeHtml(opt)}</button>`;
        });
        html += "</div>";
        wrap.innerHTML = html;

        const expected = String(item.answer ?? "").trim();
        const finish = (btn, ok) => {
          if (answering) return;
          answering = true;
          wrap.querySelectorAll("button").forEach((b) => (b.disabled = true));
          if (btn) btn.classList.add(ok ? "correct" : "wrong");
          if (ok) {
            awardCorrect();
            let msg = "¡Correcto! +puntos";
            if (item.why) msg += `<br>${escapeHtml(item.why)}`;
            showFeedback(true, msg);
          } else {
            breakStreak();
            let msg = `No exactamente. La respuesta es <b>${escapeHtml(item.answer)}</b>.`;
            if (item.why) msg += `<br>${escapeHtml(item.why)}`;
            showFeedback(false, msg);
          }
          scheduleNext();
        };

        wrap.querySelectorAll(".letter-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            finish(btn, btn.textContent === expected);
          });
        });
      }

      function renderTilde(item) {
        const wrap = $("interaction");
        const letters = Array.isArray(item.letters) ? item.letters : [];
        let html = '<div class="letter-row">';
        letters.forEach((ch, i) => {
          html += `<button type="button" class="letter-btn" data-idx="${i}">${escapeHtml(ch)}</button>`;
        });
        html += "</div>";
        if (item.answerIndex === -1) {
          html +=
            '<div style="text-align:center"><button type="button" class="btn ghost" id="tilde-none">Ninguna (sin tilde)</button></div>';
        }
        wrap.innerHTML = html;

        const finish = (picked, ok) => {
          if (answering) return;
          answering = true;
          wrap.querySelectorAll("button").forEach((b) => (b.disabled = true));
          if (picked) {
            picked.classList.add(ok ? "correct" : "wrong");
          }
          if (ok) {
            awardCorrect();
            let msg = "¡Correcto!";
            if (item.accented) msg += ` → <b>${escapeHtml(item.accented)}</b>`;
            if (item.why) msg += `<br>${escapeHtml(item.why)}`;
            showFeedback(true, msg);
          } else {
            breakStreak();
            let msg = "Incorrecto.";
            if (item.accented) msg += ` La forma correcta es <b>${escapeHtml(item.accented)}</b>.`;
            if (item.why) msg += `<br>${escapeHtml(item.why)}`;
            showFeedback(false, msg);
          }
          scheduleNext();
        };

        wrap.querySelectorAll(".letter-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.idx);
            finish(btn, idx === item.answerIndex);
          });
        });
        const noneBtn = $("tilde-none");
        if (noneBtn) {
          noneBtn.addEventListener("click", () => {
            finish(noneBtn, item.answerIndex === -1);
          });
        }
      }

      function wireSignosHelperButtons(wrap, getTargetInput) {
        wrap.querySelectorAll(".signos-helper-btn").forEach((btn) => {
          const keepInputFocus = (e) => e.preventDefault();
          btn.addEventListener("mousedown", keepInputFocus);
          btn.addEventListener("touchstart", keepInputFocus, { passive: false });
          btn.addEventListener("click", () => {
            const target = getTargetInput();
            if (!target) return;
            target.value = btn.dataset.ch;
            target.focus();
          });
        });
      }

      function signosFeedback(ok, item, fullCorrect) {
        if (ok) {
          awardCorrect();
          let msg = "¡Correcto! +puntos";
          if (item.why) msg += `<br>${escapeHtml(item.why)}`;
          showFeedback(true, msg);
        } else {
          breakStreak();
          let msg = `No exactamente. La oración correcta es: <b>${escapeHtml(fullCorrect)}</b>.`;
          if (item.why) msg += `<br>${escapeHtml(item.why)}`;
          showFeedback(false, msg);
        }
        scheduleNext();
      }

      function renderSignos(item) {
        const kind = item.kind || "signs";
        const wrap = $("interaction");
        let inputs = [];
        let fullCorrect = "";
        let isCorrect = () => false;

        if (kind === "period") {
          $("prompt").innerHTML = `
            <div class="signos-line">
              <span class="signos-sentence">${escapeHtml(item.sentence)}</span>
              <input
                type="text"
                class="signos-input"
                id="signos-period"
                maxlength="2"
                autocomplete="off"
                spellcheck="false"
                aria-label="Punto final"
              />
            </div>
          `;
          wrap.innerHTML = `
            <div class="signos-helpers" id="signos-helpers">
              <button type="button" class="signos-helper-btn" data-ch=".">.</button>
            </div>
            <div class="signos-submit-row">
              <button type="button" class="btn" id="signos-submit">Comprobar</button>
            </div>
          `;
          const periodInput = $("signos-period");
          inputs = [periodInput];
          fullCorrect = `${item.sentence}${item.close}`;
          isCorrect = () => periodInput.value === item.close;
          wireSignosHelperButtons(wrap, () => periodInput);
        } else if (kind === "comma") {
          const words = item.words || [];
          const marked = new Set();

          $("prompt").innerHTML = `<div class="comma-words-line" id="comma-words-line"></div>`;
          const line = $("comma-words-line");

          words.forEach((word, i) => {
            if (i < words.length - 1) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "comma-word-btn";
              btn.textContent = word;
              btn.addEventListener("click", () => {
                if (answering) return;
                if (marked.has(i)) {
                  marked.delete(i);
                  btn.classList.remove("comma-marked");
                  btn.textContent = word;
                } else {
                  marked.add(i);
                  btn.classList.add("comma-marked");
                  btn.textContent = `${word},`;
                }
              });
              line.appendChild(btn);
            } else {
              const span = document.createElement("span");
              span.className = "comma-word-final";
              span.textContent = word;
              line.appendChild(span);
            }
          });

          wrap.innerHTML = `
            <div class="signos-submit-row">
              <button type="button" class="btn" id="signos-submit">Comprobar</button>
            </div>
          `;

          const submit = $("signos-submit");
          submit.addEventListener("click", () => {
            if (answering) return;
            answering = true;
            submit.disabled = true;
            line.querySelectorAll(".comma-word-btn").forEach((b) => (b.disabled = true));

            const picked = [...marked].sort((a, b) => a - b);
            const expected = [...(item.commaAfter || [])].sort((a, b) => a - b);
            const ok =
              picked.length === expected.length &&
              picked.every((v, idx) => v === expected[idx]);

            signosFeedback(ok, item, item.full);
          });
          return;
        } else {
          $("prompt").innerHTML = `
            <div class="signos-line">
              <input
                type="text"
                class="signos-input"
                id="signos-open"
                maxlength="2"
                autocomplete="off"
                spellcheck="false"
                aria-label="Signo de apertura"
              />
              <span class="signos-sentence">${escapeHtml(item.sentence)}</span>
              <input
                type="text"
                class="signos-input"
                id="signos-close"
                maxlength="2"
                autocomplete="off"
                spellcheck="false"
                aria-label="Signo de cierre"
              />
            </div>
          `;
          wrap.innerHTML = `
            <div class="signos-helpers" id="signos-helpers">
              <button type="button" class="signos-helper-btn" data-ch="¿">¿</button>
              <button type="button" class="signos-helper-btn" data-ch="¡">¡</button>
              <button type="button" class="signos-helper-btn" data-ch="?">?</button>
              <button type="button" class="signos-helper-btn" data-ch="!">!</button>
            </div>
            <div class="signos-submit-row">
              <button type="button" class="btn" id="signos-submit">Comprobar</button>
            </div>
          `;
          const openInput = $("signos-open");
          const closeInput = $("signos-close");
          inputs = [openInput, closeInput];
          fullCorrect = `${item.open}${item.sentence}${item.close}`;
          let lastSignosFocus = "open";
          openInput.addEventListener("focus", () => {
            lastSignosFocus = "open";
          });
          closeInput.addEventListener("focus", () => {
            lastSignosFocus = "close";
          });
          isCorrect = () =>
            openInput.value === item.open && closeInput.value === item.close;
          wireSignosHelperButtons(wrap, () =>
            lastSignosFocus === "close" ? closeInput : openInput
          );
        }

        const submit = $("signos-submit");
        const check = () => {
          if (answering) return;
          if (!inputs.some((el) => el.value)) return;

          answering = true;
          submit.disabled = true;
          inputs.forEach((el) => (el.disabled = true));
          wrap.querySelectorAll(".signos-helper-btn").forEach((b) => (b.disabled = true));

          signosFeedback(isCorrect(), item, fullCorrect);
        };

        submit.addEventListener("click", check);
        inputs.forEach((el) => {
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter") check();
          });
        });
        inputs[0].focus();
      }

      function renderError(item) {
        const wrap = $("interaction");
        const tokens = Array.isArray(item.tokens) ? item.tokens : [];
        let html = '<div class="chip-row">';
        tokens.forEach((tok, i) => {
          html += `<button type="button" class="chip" data-idx="${i}">${escapeHtml(tok)}</button>`;
        });
        html += "</div>";
        wrap.innerHTML = html;

        wrap.querySelectorAll(".chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            if (answering) return;
            answering = true;
            const idx = Number(chip.dataset.idx);
            const ok = idx === item.badIndex;
            wrap.querySelectorAll(".chip").forEach((c) => (c.disabled = true));
            chip.classList.add(ok ? "correct" : "wrong");

            if (ok) {
              awardCorrect();
              let msg = "¡Encontraste el error!";
              if (item.fixed) msg += ` → <b>${escapeHtml(item.fixed)}</b>`;
              if (item.why) msg += `<br>${escapeHtml(item.why)}`;
              showFeedback(true, msg);
            } else {
              breakStreak();
              let msg = "Esa palabra no es la incorrecta.";
              if (item.fixed) msg += ` La oración correcta: <b>${escapeHtml(item.fixed)}</b>`;
              if (item.why) msg += `<br>${escapeHtml(item.why)}`;
              showFeedback(false, msg);
            }
            scheduleNext();
          });
        });
      }

      function startRound() {
        currentRound = dealNextRound();
        $("feedback").className = "feedback";
        $("feedback").innerHTML = "";
        $("round-instruction").hidden = true;
        $("interaction").innerHTML = "";

        if (!currentRound) {
          $("mech-tag").textContent = "Sin preguntas";
          $("prompt").textContent = "No hay preguntas para este módulo.";
          return;
        }

        const { mech, item } = currentRound;
        $("mech-tag").textContent = MECH_LABELS[mech] || mech;
        showRoundInstruction(mech, item);

        if (mech === "fill") {
          renderFillPrompt(item);
          renderFill(item);
        } else if (mech === "tilde") {
          $("prompt").textContent = item.word || item.prompt || "";
          renderTilde(item);
        } else if (mech === "signos") {
          renderSignos(item);
        } else {
          $("prompt").textContent = "";
          renderError(item);
        }
      }


      function setupAuthListener(uid) {
        supabase.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_OUT" || !session) {
            window.location.replace("../index.html");
            return;
          }
          if (session.user.id !== uid) {
            window.location.replace("../redwood-login.html");
          }
        });
      }

      (async () => {
        const {
          data: { user },
          error,
        } = await supabase.auth.getUser();
        if (error || !user) {
          window.location.replace("../redwood-login.html");
          return;
        }
        USER_ID = user.id;

        await loadProgress();
        renderModuleList();
        setupNavigation();
        $("scorebar").hidden = true;

        $("loading").hidden = true;
        $("app").hidden = false;

        setupAuthListener(USER_ID);
      })();
    </script>
  </body>
</html>
