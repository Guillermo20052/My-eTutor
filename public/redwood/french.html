<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Français · Redwood eTutor</title>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      :root {
        --rw-accent: #a63d3d;
        --rw-accent-d: #8b2e2e;
        --rw-sky: #fde8e4;
        --rw-sand: #fff6e8;
        --rw-leaf: #2d8a5e;
        --rw-ok: #1c9e6a;
        --rw-bad: #c0392b;
      }

      body {
        background: linear-gradient(165deg, var(--rw-sand) 0%, #fff 40%, var(--rw-sky) 100%);
        min-height: 100vh;
      }

      .wrap { max-width: 820px; margin: 0 auto; padding: 18px 16px 48px; }

      .top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
      }
      .back {
        text-decoration: none; font-weight: 800; color: var(--rw-accent);
        font-size: .92rem;
      }
      .back:hover { text-decoration: underline; }
      .brand-block { flex: 1; min-width: 180px; }
      .brand-block .mascot { font-size: 1.8rem; line-height: 1; }
      .brand-block h1 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: 1.35rem; margin-top: 4px;
      }
      .brand-block p { color: var(--soft); font-weight: 700; font-size: .88rem; }

      .scorebar { display: flex; gap: 10px; flex-wrap: wrap; }
      .scorebox {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 14px;
        padding: 8px 14px; text-align: center; min-width: 88px;
        box-shadow: var(--shadow-sm);
      }
      .scorebox .lbl {
        font-size: .68rem; font-weight: 800; color: var(--soft);
        text-transform: uppercase; letter-spacing: .06em;
      }
      .scorebox .val {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: 1.35rem; color: var(--rw-accent-d); line-height: 1.2;
      }

      .tabs {
        display: flex; gap: 8px; background: #fff; border: 2px solid #f0cfc7;
        border-radius: 16px; padding: 6px; margin-bottom: 18px;
        box-shadow: var(--shadow-sm);
      }
      .tabs button {
        flex: 1; border: 0; background: transparent; cursor: pointer;
        font-family: "Fredoka", sans-serif; font-weight: 600; color: var(--soft);
        padding: 11px 14px; border-radius: 11px; font-size: 1rem;
        transition: background .15s, color .15s;
      }
      .tabs button.active {
        background: linear-gradient(145deg, var(--rw-accent), var(--rw-accent-d));
        color: #fff; box-shadow: 0 6px 14px -8px rgba(139, 46, 46, .9);
      }
      .tabs button:not(.active):hover { background: var(--rw-sky); color: var(--rw-accent-d); }

      .panel { display: none; }
      .panel.on { display: block; }

      .module-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
        gap: 14px; margin-bottom: 8px;
      }
      .module-tile {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; min-height: 118px; padding: 16px 12px;
        border: 2px solid #f0cfc7; border-radius: 20px; background: #fff;
        box-shadow: var(--shadow-sm); cursor: pointer;
        font-family: "Fredoka", sans-serif; transition: transform .15s, border-color .15s, box-shadow .15s;
      }
      .module-tile:hover {
        transform: translateY(-3px); border-color: var(--rw-accent);
        box-shadow: 0 10px 24px -12px rgba(166, 61, 61, .35);
      }
      .module-tile .mod-emoji { font-size: 2rem; line-height: 1; }
      .module-tile .mod-title {
        font-weight: 700; font-size: .92rem; color: var(--rw-accent-d);
        text-align: center; line-height: 1.25;
      }
      .module-back, .game-nav a {
        display: inline-block; margin-bottom: 14px;
        text-decoration: none; font-weight: 800; color: var(--rw-accent); font-size: .92rem;
      }
      .module-back:hover, .game-nav a:hover { text-decoration: underline; }
      .game-nav { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
      .module-play-btn { width: 100%; margin-top: 8px; }

      .lesson {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 22px;
        padding: 22px 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
      }
      .lesson .num {
        display: inline-block; font-size: .72rem; font-weight: 800;
        color: var(--rw-accent); background: var(--rw-sky);
        padding: 4px 10px; border-radius: 999px; margin-bottom: 8px;
      }
      .lesson h2 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: 1.25rem; margin-bottom: 4px;
      }
      .lesson .sub { color: var(--soft); font-weight: 700; font-size: .92rem; margin-bottom: 12px; }
      .lesson .intro {
        color: var(--ink); font-weight: 600; line-height: 1.55; margin-bottom: 14px;
      }
      .lesson .sec { margin-bottom: 12px; }
      .lesson .sec h3 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--navy); font-size: 1rem; margin-bottom: 4px;
      }
      .lesson .sec p { color: var(--ink); font-weight: 600; line-height: 1.55; font-size: .95rem; }
      .recuerda {
        margin-top: 14px; padding: 14px 16px; border-radius: 14px;
        background: linear-gradient(135deg, #e8f8ef, #fff);
        border: 2px solid rgba(45, 138, 94, .35);
        color: var(--ink); font-weight: 700; line-height: 1.5; font-size: .94rem;
      }
      .recuerda::before { content: "💡 Remember: "; color: var(--rw-leaf); font-weight: 800; }

      .game-card {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 24px;
        padding: 24px 20px; box-shadow: var(--shadow-sm);
      }
      .mech-tag {
        display: inline-block; font-size: .74rem; font-weight: 800;
        color: var(--rw-accent); background: var(--rw-sky);
        padding: 5px 12px; border-radius: 999px; margin-bottom: 10px;
      }
      .round-instruction {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.05rem, 3.8vw, 1.28rem); color: var(--rw-accent-d);
        text-align: center; line-height: 1.45; margin-bottom: 16px;
      }
      .prompt {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.1rem, 3.5vw, 1.45rem); color: var(--navy);
        text-align: center; line-height: 1.45; margin-bottom: 14px;
        word-break: break-word;
      }
      .word-big {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.8rem, 6vw, 2.6rem); color: var(--rw-accent-d);
        text-align: center; margin-bottom: 8px; line-height: 1.2;
      }
      .helper-text {
        text-align: center; color: var(--soft); font-weight: 700;
        font-size: .92rem; margin-bottom: 14px; line-height: 1.4;
      }
      .dialogue-line {
        display: flex; align-items: center; justify-content: center;
        flex-wrap: wrap; gap: 6px;
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.15rem, 4vw, 1.5rem); color: var(--navy);
        line-height: 1.4; text-align: center;
      }
      .dialogue-part { white-space: nowrap; }
      .dialogue-blank {
        display: inline-block; min-width: 72px; height: 1.2em;
        border: 3px dashed var(--rw-accent); border-radius: 12px;
        background: var(--rw-sky); vertical-align: middle;
      }
      .opt-btn {
        display: block; width: 100%; max-width: 420px; margin: 0 auto 10px;
        font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.08rem;
        padding: 16px 20px; border-radius: 16px; cursor: pointer;
        border: 2px solid #f0cfc7; background: var(--rw-sand); color: var(--navy);
        text-align: center; transition: transform .12s, border-color .12s, background .12s;
      }
      .opt-btn:hover:not(:disabled) {
        transform: translateY(-2px); border-color: var(--rw-accent);
        background: var(--rw-sky);
      }
      .opt-btn:disabled { cursor: default; opacity: .65; }
      .opt-btn.correct { background: #e8f8ef; border-color: var(--rw-ok); color: var(--rw-ok); }
      .opt-btn.wrong { background: #fdecea; border-color: var(--rw-bad); color: var(--rw-bad); }
      .gender-row {
        display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
      }
      .gender-btn {
        flex: 1; min-width: 120px; max-width: 180px;
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.5rem, 5vw, 2rem); padding: 22px 16px;
        border-radius: 18px; cursor: pointer;
        border: 3px solid #f0cfc7; background: var(--rw-sand); color: var(--rw-accent-d);
        transition: transform .12s, border-color .12s, background .12s;
      }
      .gender-btn:hover:not(:disabled) {
        transform: scale(1.04); border-color: var(--rw-accent); background: var(--rw-sky);
      }
      .gender-btn:disabled { cursor: default; opacity: .65; }
      .gender-btn.correct { background: #e8f8ef; border-color: var(--rw-ok); color: var(--rw-ok); }
      .gender-btn.wrong { background: #fdecea; border-color: var(--rw-bad); color: var(--rw-bad); }

      .feedback {
        margin-top: 16px; padding: 14px 16px; border-radius: 14px;
        font-weight: 700; line-height: 1.5; text-align: center; display: none;
      }
      .feedback.show { display: block; }
      .feedback.good {
        background: #e8f8ef; border: 2px solid rgba(28, 158, 106, .4); color: #166534;
      }
      .feedback.bad {
        background: #fdecea; border: 2px solid rgba(192, 57, 43, .35); color: #922b21;
      }

      .loader {
        min-height: 70vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; text-align: center;
      }
      .loader .brand {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--navy); font-size: 1.5rem;
      }
      .loader .brand span { color: var(--rw-accent); }
      .spinner {
        width: 38px; height: 38px; border-radius: 50%;
        border: 4px solid var(--line); border-top-color: var(--rw-accent);
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #app[hidden], .loader[hidden] { display: none !important; }
    </style>
    <link rel="stylesheet" href="./island-theme.css" />
  </head>
  <body class="rw-island-page">
    <div class="rw-island-scene" aria-hidden="true"></div>
    <div class="wrap loader" id="loading">
      <div class="brand">Redwood <span>eTutor</span></div>
      <div class="spinner" aria-hidden="true"></div>
      <p style="color:var(--soft);font-weight:800">Loading Français…</p>
    </div>

    <div class="wrap" id="app" hidden>
      <header class="top">
        <a class="back" href="../dashboard.html">← Back to dashboard</a>
        <div class="brand-block">
          <div class="mascot" aria-hidden="true">🌺🇫🇷</div>
          <h1>Français</h1>
          <p>Island of learning · endless practice</p>
        </div>
        <div class="scorebar" id="scorebar" hidden>
          <div class="scorebox">
            <div class="lbl">Session</div>
            <div class="val" id="session-score">0</div>
          </div>
          <div class="scorebox">
            <div class="lbl">Total</div>
            <div class="val" id="total-score">0</div>
          </div>
          <div class="scorebox">
            <div class="lbl">Streak</div>
            <div class="val" id="streak-val">0 🔥</div>
          </div>
        </div>
      </header>

      <section class="panel on" id="view-modules">
        <div class="module-grid" id="module-grid"></div>
      </section>

      <section class="panel" id="view-module-study" hidden>
        <a href="#" class="module-back" id="back-to-modules">← Back to modules</a>
        <div id="module-lesson"></div>
        <button type="button" class="btn module-play-btn" id="btn-start-module-game">🎮 Play</button>
      </section>

      <section class="panel" id="view-game" hidden>
        <nav class="game-nav">
          <a href="#" id="back-to-module-study">← Back to module</a>
          <a href="#" id="back-to-modules-from-game">← Modules</a>
        </nav>
        <div class="game-card" id="game-area">
          <div class="mech-tag" id="mech-tag"></div>
          <div class="round-instruction" id="round-instruction" hidden></div>
          <div class="prompt" id="prompt"></div>
          <div id="interaction"></div>
          <div class="feedback" id="feedback" role="status"></div>
        </div>
      </section>
    </div>

    <script src="./french_content.js"></script>
    <script type="module">
      import { supabase } from "../js/supabase.js";

      const SUBJECT = "french";
      const MECH_LABELS = {
        match: "Match the meaning",
        toFrench: "Say it in French",
        dialogue: "Complete the dialogue",
        gender: "Le ou la?",
      };
      const MECHANICS = ["match", "toFrench", "dialogue", "gender"];
      const ADVANCE_MS = 2200;

      let USER_ID = null;
      let totalScore = 0;
      let sessionScore = 0;
      let streak = 0;
      let selectedModule = null;
      let moduleDeck = [];
      let deckIndex = 0;
      let lastDealtKey = null;
      let answering = false;
      let currentRound = null;

      const $ = (id) => document.getElementById(id);

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      function updateScoreboard() {
        $("session-score").textContent = sessionScore;
        $("total-score").textContent = totalScore;
        $("streak-val").textContent = `${streak} 🔥`;
      }

      function buildData() {
        return {
          score: totalScore,
          sessionBest: sessionScore,
          streak,
          updatedAt: new Date().toISOString(),
        };
      }

      let saving = false;
      let dirty = false;

      async function saveProgress() {
        if (!USER_ID) return;
        dirty = true;
        if (saving) return;
        saving = true;
        try {
          while (dirty) {
            dirty = false;
            const data = buildData();
            const { error } = await supabase
              .from("progress")
              .upsert(
                {
                  user_id: USER_ID,
                  subject: SUBJECT,
                  data,
                  updated_at: new Date().toISOString(),
                },
                { onConflict: "user_id,subject" }
              );
            if (error) console.error("Error saving progress:", error.message);
          }
        } finally {
          saving = false;
        }
      }

      async function loadProgress() {
        const { data: row } = await supabase
          .from("progress")
          .select("data")
          .eq("user_id", USER_ID)
          .eq("subject", SUBJECT)
          .maybeSingle();
        if (row?.data && Number.isFinite(row.data.score)) {
          totalScore = row.data.score;
        } else {
          totalScore = 0;
        }
        sessionScore = 0;
        streak = 0;
        updateScoreboard();
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function deckEntryKey(entry) {
        return `${entry.mech}:${entry.idx}`;
      }

      function buildModulePool(module) {
        const bank = window.FR_BANK;
        if (!bank || !module) return [];
        const topics = new Set(module.topics || []);
        const pool = [];
        for (const mech of MECHANICS) {
          const items = bank[mech];
          if (!Array.isArray(items)) continue;
          items.forEach((item, idx) => {
            if (topics.has(item.topic)) pool.push({ mech, item, idx });
          });
        }
        return pool;
      }

      function reshuffleModuleDeck(module) {
        moduleDeck = shuffle(buildModulePool(module));
        if (
          moduleDeck.length > 1 &&
          lastDealtKey &&
          deckEntryKey(moduleDeck[0]) === lastDealtKey
        ) {
          [moduleDeck[0], moduleDeck[1]] = [moduleDeck[1], moduleDeck[0]];
        }
        deckIndex = 0;
      }

      function dealNextRound() {
        if (!selectedModule) return null;
        if (!moduleDeck.length) {
          const pool = buildModulePool(selectedModule);
          if (!pool.length) return null;
          reshuffleModuleDeck(selectedModule);
        }
        if (deckIndex >= moduleDeck.length) {
          lastDealtKey = deckEntryKey(moduleDeck[moduleDeck.length - 1]);
          reshuffleModuleDeck(selectedModule);
        }
        const entry = moduleDeck[deckIndex++];
        lastDealtKey = deckEntryKey(entry);
        return { mech: entry.mech, item: entry.item };
      }

      function showView(name) {
        const views = {
          modules: $("view-modules"),
          study: $("view-module-study"),
          game: $("view-game"),
        };
        for (const [key, el] of Object.entries(views)) {
          el.hidden = key !== name;
          el.classList.toggle("on", key === name);
        }
        $("scorebar").hidden = name !== "game";
      }

      function lessonHtml(lesson) {
        const sections = (lesson.sections || [])
          .map(
            (s) =>
              `<div class="sec"><h3>${escapeHtml(s.h)}</h3><p>${escapeHtml(s.body)}</p></div>`
          )
          .join("");
        return `
          <article class="lesson">
            <span class="num">Lesson ${escapeHtml(lesson.num ?? lesson.id)}</span>
            <h2>${escapeHtml(lesson.title)}</h2>
            <p class="sub">${escapeHtml(lesson.subtitle || "")}</p>
            <p class="intro">${escapeHtml(lesson.intro || "")}</p>
            ${sections}
            ${lesson.recuerda ? `<div class="recuerda">${escapeHtml(lesson.recuerda)}</div>` : ""}
          </article>
        `;
      }

      function findLesson(lessonId) {
        return (window.FR_LESSONS || []).find((l) => l.id === lessonId);
      }

      function renderModuleList() {
        const root = $("module-grid");
        root.innerHTML = "";
        const modules = window.FR_MODULES || [];
        if (!modules.length) {
          root.innerHTML =
            '<p style="text-align:center;color:var(--soft);font-weight:700">No modules loaded.</p>';
          return;
        }
        for (const mod of modules) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "module-tile";
          btn.innerHTML = `<span class="mod-emoji">${mod.emoji || "📘"}</span><span class="mod-title">${escapeHtml(mod.title)}</span>`;
          btn.addEventListener("click", () => openModuleStudy(mod));
          root.appendChild(btn);
        }
      }

      function openModuleStudy(module) {
        selectedModule = module;
        const lesson = findLesson(module.lesson);
        const root = $("module-lesson");
        if (!lesson) {
          root.innerHTML =
            '<p style="text-align:center;color:var(--soft);font-weight:700">No lesson for this module.</p>';
        } else {
          root.innerHTML = lessonHtml(lesson);
        }
        showView("study");
      }

      function startModuleGame() {
        if (!selectedModule) return;
        lastDealtKey = null;
        reshuffleModuleDeck(selectedModule);
        answering = false;
        currentRound = null;
        showView("game");
        startRound();
      }

      function setupNavigation() {
        $("back-to-modules").addEventListener("click", (e) => {
          e.preventDefault();
          showView("modules");
        });
        $("back-to-modules-from-game").addEventListener("click", (e) => {
          e.preventDefault();
          showView("modules");
        });
        $("back-to-module-study").addEventListener("click", (e) => {
          e.preventDefault();
          if (selectedModule) openModuleStudy(selectedModule);
        });
        $("btn-start-module-game").addEventListener("click", startModuleGame);
      }

      function showRoundInstruction(mech, item) {
        const el = $("round-instruction");
        const text = item?.ask || window.FR_UI?.[mech];
        if (text) {
          el.textContent = text;
          el.hidden = false;
        } else {
          el.hidden = true;
        }
      }

      function showFeedback(ok, html) {
        const fb = $("feedback");
        fb.className = `feedback show ${ok ? "good" : "bad"}`;
        fb.innerHTML = html;
      }

      function awardCorrect() {
        let gained = 10;
        streak += 1;
        if (streak > 0 && streak % 3 === 0) gained += 5;
        sessionScore += gained;
        totalScore += gained;
        updateScoreboard();
        saveProgress();
      }

      function breakStreak() {
        streak = 0;
        updateScoreboard();
      }

      function scheduleNext() {
        setTimeout(() => {
          answering = false;
          startRound();
        }, ADVANCE_MS);
      }

      function renderOptionButtons(item, onPick, btnClass = "opt-btn") {
        const wrap = $("interaction");
        wrap.innerHTML = "";
        (item.options || []).forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = btnClass;
          btn.textContent = opt;
          btn.addEventListener("click", () => {
            if (answering) return;
            answering = true;
            wrap.querySelectorAll("button").forEach((b) => (b.disabled = true));
            const ok = i === item.answer;
            btn.classList.add(ok ? "correct" : "wrong");
            onPick(ok, item, btn);
          });
          wrap.appendChild(btn);
        });
      }

      function finishAnswer(ok, item, extraHtml = "") {
        if (ok) {
          awardCorrect();
          showFeedback(true, `Correct! +points<br>${escapeHtml(item.why || "")}${extraHtml}`);
        } else {
          breakStreak();
          showFeedback(false, `Not quite.<br>${escapeHtml(item.why || "")}${extraHtml}`);
        }
        scheduleNext();
      }

      function renderDialogueLine(line) {
        const u = line.indexOf("___");
        const before = u >= 0 ? line.slice(0, u) : line;
        const after = u >= 0 ? line.slice(u + 3) : "";
        return `
          <div class="dialogue-line">
            <span class="dialogue-part">${escapeHtml(before)}</span>
            <span class="dialogue-blank" aria-hidden="true"></span>
            <span class="dialogue-part">${escapeHtml(after)}</span>
          </div>
        `;
      }

      function renderMatch(item) {
        $("prompt").innerHTML = `<div class="word-big">${escapeHtml(item.fr)}</div>`;
        renderOptionButtons(item, (ok, it) => finishAnswer(ok, it));
      }

      function renderToFrench(item) {
        $("prompt").innerHTML = `<div class="word-big" style="font-size:clamp(1.3rem,4.5vw,1.8rem)">${escapeHtml(item.meaning)}</div>`;
        renderOptionButtons(item, (ok, it) => finishAnswer(ok, it));
      }

      function renderDialogue(item) {
        $("prompt").innerHTML = renderDialogueLine(item.line || "");
        if (item.translation) {
          const helper = document.createElement("p");
          helper.className = "helper-text";
          helper.textContent = `💬 ${item.translation}`;
          $("prompt").appendChild(helper);
        }
        renderOptionButtons(item, (ok, it) => finishAnswer(ok, it));
      }

      function renderGender(item) {
        $("prompt").innerHTML = `<div class="word-big">${escapeHtml(item.noun)}</div>`;
        const wrap = $("interaction");
        wrap.innerHTML = '<div class="gender-row" id="gender-row"></div>';
        const row = $("gender-row");
        (item.options || []).forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "gender-btn";
          btn.textContent = opt;
          btn.addEventListener("click", () => {
            if (answering) return;
            answering = true;
            row.querySelectorAll("button").forEach((b) => (b.disabled = true));
            const ok = i === item.answer;
            btn.classList.add(ok ? "correct" : "wrong");
            const extra = item.full
              ? `<br>→ <b>${escapeHtml(item.full)}</b>`
              : "";
            finishAnswer(ok, item, extra);
          });
          row.appendChild(btn);
        });
      }

      function startRound() {
        currentRound = dealNextRound();
        $("feedback").className = "feedback";
        $("feedback").innerHTML = "";
        $("round-instruction").hidden = true;
        $("prompt").innerHTML = "";
        $("interaction").innerHTML = "";

        if (!currentRound) {
          $("mech-tag").textContent = "No questions";
          $("prompt").textContent = "No questions for this module.";
          return;
        }

        const { mech, item } = currentRound;
        $("mech-tag").textContent = MECH_LABELS[mech] || mech;
        showRoundInstruction(mech, item);

        if (mech === "match") renderMatch(item);
        else if (mech === "toFrench") renderToFrench(item);
        else if (mech === "dialogue") renderDialogue(item);
        else renderGender(item);
      }

      function setupAuthListener(uid) {
        supabase.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_OUT" || !session) {
            window.location.replace("../index.html");
            return;
          }
          if (session.user.id !== uid) {
            window.location.replace("../redwood-login.html");
          }
        });
      }

      (async () => {
        const {
          data: { user },
          error,
        } = await supabase.auth.getUser();
        if (error || !user) {
          window.location.replace("../redwood-login.html");
          return;
        }
        USER_ID = user.id;

        const { data: profile } = await supabase
          .from("profiles")
          .select("has_access")
          .eq("id", USER_ID)
          .single();

        if (profile?.has_access !== true) {
          window.location.replace("../dashboard.html");
          return;
        }

        await loadProgress();
        renderModuleList();
        setupNavigation();
        $("scorebar").hidden = true;

        $("loading").hidden = true;
        $("app").hidden = false;

        setupAuthListener(USER_ID);
      })();
    </script>
  </body>
</html>
