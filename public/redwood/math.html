<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math · Redwood eTutor</title>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      :root {
        --rw-accent: #a63d3d;
        --rw-accent-d: #8b2e2e;
        --rw-sky: #fde8e4;
        --rw-sand: #fff6e8;
        --rw-leaf: #2d8a5e;
        --rw-ok: #1c9e6a;
        --rw-bad: #c0392b;
      }

      body {
        background: linear-gradient(165deg, var(--rw-sand) 0%, #fff 40%, var(--rw-sky) 100%);
        min-height: 100vh;
      }

      .wrap { max-width: 820px; margin: 0 auto; padding: 18px 16px 48px; }

      .top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
      }
      .back {
        text-decoration: none; font-weight: 800; color: var(--rw-accent);
        font-size: .92rem;
      }
      .back:hover { text-decoration: underline; }
      .brand-block { flex: 1; min-width: 180px; }
      .brand-block .mascot { font-size: 1.8rem; line-height: 1; }
      .brand-block h1 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: 1.35rem; margin-top: 4px;
      }
      .brand-block p { color: var(--soft); font-weight: 700; font-size: .88rem; }

      .scorebar { display: flex; gap: 10px; flex-wrap: wrap; }
      .scorebox {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 14px;
        padding: 8px 14px; text-align: center; min-width: 88px;
        box-shadow: var(--shadow-sm);
      }
      .scorebox .lbl {
        font-size: .68rem; font-weight: 800; color: var(--soft);
        text-transform: uppercase; letter-spacing: .06em;
      }
      .scorebox .val {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: 1.35rem; color: var(--rw-accent-d); line-height: 1.2;
      }

      .tabs {
        display: flex; gap: 8px; background: #fff; border: 2px solid #f0cfc7;
        border-radius: 16px; padding: 6px; margin-bottom: 18px;
        box-shadow: var(--shadow-sm);
      }
      .tabs button {
        flex: 1; border: 0; background: transparent; cursor: pointer;
        font-family: "Fredoka", sans-serif; font-weight: 600; color: var(--soft);
        padding: 11px 14px; border-radius: 11px; font-size: 1rem;
        transition: background .15s, color .15s;
      }
      .tabs button.active {
        background: linear-gradient(145deg, var(--rw-accent), var(--rw-accent-d));
        color: #fff; box-shadow: 0 6px 14px -8px rgba(139, 46, 46, .9);
      }
      .tabs button:not(.active):hover { background: var(--rw-sky); color: var(--rw-accent-d); }

      .panel { display: none; }
      .panel.on { display: block; }

      .lesson {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 22px;
        padding: 22px 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
      }
      .lesson .num {
        display: inline-block; font-size: .72rem; font-weight: 800;
        color: var(--rw-accent); background: var(--rw-sky);
        padding: 4px 10px; border-radius: 999px; margin-bottom: 8px;
      }
      .lesson h2 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--rw-accent-d); font-size: 1.25rem; margin-bottom: 4px;
      }
      .lesson .sub { color: var(--soft); font-weight: 700; font-size: .92rem; margin-bottom: 12px; }
      .lesson .intro {
        color: var(--ink); font-weight: 600; line-height: 1.55; margin-bottom: 14px;
      }
      .lesson .sec { margin-bottom: 12px; }
      .lesson .sec h3 {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--navy); font-size: 1rem; margin-bottom: 4px;
      }
      .lesson .sec p { color: var(--ink); font-weight: 600; line-height: 1.55; font-size: .95rem; }
      .recuerda {
        margin-top: 14px; padding: 14px 16px; border-radius: 14px;
        background: linear-gradient(135deg, #e8f8ef, #fff);
        border: 2px solid rgba(45, 138, 94, .35);
        color: var(--ink); font-weight: 700; line-height: 1.5; font-size: .94rem;
      }
      .recuerda::before { content: "💡 Remember: "; color: var(--rw-leaf); font-weight: 800; }

      .game-card {
        background: #fff; border: 2px solid #f0cfc7; border-radius: 24px;
        padding: 24px 20px; box-shadow: var(--shadow-sm);
      }
      .mech-tag {
        display: inline-block; font-size: .74rem; font-weight: 800;
        color: var(--rw-accent); background: var(--rw-sky);
        padding: 5px 12px; border-radius: 999px; margin-bottom: 10px;
      }
      .round-instruction {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.05rem, 3.8vw, 1.28rem); color: var(--rw-accent-d);
        text-align: center; line-height: 1.45; margin-bottom: 16px;
      }
      .prompt {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.05rem, 3.5vw, 1.35rem); color: var(--navy);
        text-align: center; line-height: 1.5; margin-bottom: 16px;
        word-break: break-word;
      }

      .typed-row {
        display: flex; flex-direction: column; align-items: center;
        gap: 14px; margin-bottom: 4px;
      }
      .num-input {
        display: block; box-sizing: border-box;
        width: 120px; min-height: 56px; padding: 8px 12px;
        border: 3px solid var(--rw-accent); border-radius: 14px;
        background: var(--rw-sky); color: var(--rw-accent-d);
        text-align: center; font-family: "Fredoka", sans-serif;
        font-weight: 800; font-size: clamp(1.5rem, 5vw, 2rem);
      }
      .num-input:focus {
        outline: 3px solid rgba(166, 61, 61, .35); outline-offset: 2px;
      }

      .compare-row {
        display: flex; align-items: center; justify-content: center;
        flex-wrap: wrap; gap: 12px 18px; margin-bottom: 8px;
      }
      .compare-val {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.6rem, 5.5vw, 2.4rem); color: var(--rw-accent-d);
        padding: 10px 16px; background: var(--rw-sand);
        border: 2px solid #f0cfc7; border-radius: 14px;
      }
      .compare-gap {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: 1.4rem; color: var(--soft);
      }
      .symbol-row {
        display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
      }
      .symbol-btn {
        min-width: 72px; font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: clamp(1.6rem, 5vw, 2.2rem); padding: 18px 22px;
        border-radius: 16px; cursor: pointer;
        border: 3px solid #f0cfc7; background: var(--rw-sand); color: var(--rw-accent-d);
        transition: transform .12s, border-color .12s, background .12s;
      }
      .symbol-btn:hover:not(:disabled) {
        transform: scale(1.05); border-color: var(--rw-accent); background: var(--rw-sky);
      }
      .symbol-btn:disabled { cursor: default; opacity: .65; }
      .symbol-btn.correct { background: #e8f8ef; border-color: var(--rw-ok); color: var(--rw-ok); }
      .symbol-btn.wrong { background: #fdecea; border-color: var(--rw-bad); color: var(--rw-bad); }

      .opt-btn {
        display: block; width: 100%; max-width: 420px; margin: 0 auto 10px;
        font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1.05rem;
        padding: 16px 20px; border-radius: 16px; cursor: pointer;
        border: 2px solid #f0cfc7; background: var(--rw-sand); color: var(--navy);
        text-align: center; transition: transform .12s, border-color .12s, background .12s;
      }
      .opt-btn:hover:not(:disabled) {
        transform: translateY(-2px); border-color: var(--rw-accent); background: var(--rw-sky);
      }
      .opt-btn:disabled { cursor: default; opacity: .65; }
      .opt-btn.correct { background: #e8f8ef; border-color: var(--rw-ok); color: var(--rw-ok); }
      .opt-btn.wrong { background: #fdecea; border-color: var(--rw-bad); color: var(--rw-bad); }

      .btn {
        font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 1rem;
        border: 0; border-radius: 12px; padding: 12px 24px; cursor: pointer;
        background: linear-gradient(145deg, var(--rw-accent), var(--rw-accent-d));
        color: #fff; box-shadow: var(--shadow-sm);
      }
      .btn:disabled { opacity: .55; cursor: not-allowed; }

      .feedback {
        margin-top: 16px; padding: 14px 16px; border-radius: 14px;
        font-weight: 700; line-height: 1.5; text-align: center; display: none;
      }
      .feedback.show { display: block; }
      .feedback.good {
        background: #e8f8ef; border: 2px solid rgba(28, 158, 106, .4); color: #166534;
      }
      .feedback.bad {
        background: #fdecea; border: 2px solid rgba(192, 57, 43, .35); color: #922b21;
      }

      .loader {
        min-height: 70vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; text-align: center;
      }
      .loader .brand {
        font-family: "Fredoka", sans-serif; font-weight: 700;
        color: var(--navy); font-size: 1.5rem;
      }
      .loader .brand span { color: var(--rw-accent); }
      .spinner {
        width: 38px; height: 38px; border-radius: 50%;
        border: 4px solid var(--line); border-top-color: var(--rw-accent);
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #app[hidden], .loader[hidden] { display: none !important; }
    </style>
    <link rel="stylesheet" href="./island-theme.css" />
  </head>
  <body class="rw-island-page">
    <div class="rw-island-scene" aria-hidden="true"></div>
    <div class="wrap loader" id="loading">
      <div class="brand">Redwood <span>eTutor</span></div>
      <div class="spinner" aria-hidden="true"></div>
      <p style="color:var(--soft);font-weight:800">Loading Math…</p>
    </div>

    <div class="wrap" id="app" hidden>
      <header class="top">
        <a class="back" href="../dashboard.html">← Back to dashboard</a>
        <div class="brand-block">
          <div class="mascot" aria-hidden="true">🌺🔢</div>
          <h1>Math</h1>
          <p>Island of learning · endless practice</p>
        </div>
        <div class="scorebar" id="scorebar" hidden>
          <div class="scorebox">
            <div class="lbl">Session</div>
            <div class="val" id="session-score">0</div>
          </div>
          <div class="scorebox">
            <div class="lbl">Total</div>
            <div class="val" id="total-score">0</div>
          </div>
          <div class="scorebox">
            <div class="lbl">Streak</div>
            <div class="val" id="streak-val">0 🔥</div>
          </div>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" class="active" id="tab-study" role="tab" aria-selected="true">
          📚 Study
        </button>
        <button type="button" id="tab-play" role="tab" aria-selected="false">
          🎮 Play
        </button>
      </nav>

      <section class="panel on" id="panel-study" role="tabpanel" aria-labelledby="tab-study">
        <div id="lessons"></div>
      </section>

      <section class="panel" id="panel-play" role="tabpanel" aria-labelledby="tab-play" hidden>
        <div class="game-card" id="game-area">
          <div class="mech-tag" id="mech-tag"></div>
          <div class="round-instruction" id="round-instruction" hidden></div>
          <div class="prompt" id="prompt"></div>
          <div id="interaction"></div>
          <div class="feedback" id="feedback" role="status"></div>
        </div>
      </section>
    </div>

    <script src="./math_content.js"></script>
    <script type="module">
      import { supabase } from "../js/supabase.js";

      const SUBJECT = "math";
      const MECH_LABELS = {
        type: "Type the answer",
        compare: "Compare numbers",
        shape: "Shapes",
        array: "Arrays",
        fraction: "Fractions",
        money: "Money",
        pictograph: "Pictograph",
        measure: "Measuring",
      };
      const MECHANICS = [
        "type",
        "compare",
        "shape",
        "array",
        "fraction",
        "money",
        "pictograph",
        "measure",
      ];
      const ADVANCE_MS = 2200;

      let USER_ID = null;
      let totalScore = 0;
      let sessionScore = 0;
      let streak = 0;
      let lastItemKey = null;
      let answering = false;
      let currentRound = null;

      const $ = (id) => document.getElementById(id);

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      function updateScoreboard() {
        $("session-score").textContent = sessionScore;
        $("total-score").textContent = totalScore;
        $("streak-val").textContent = `${streak} 🔥`;
      }

      function buildData() {
        return {
          score: totalScore,
          sessionBest: sessionScore,
          streak,
          updatedAt: new Date().toISOString(),
        };
      }

      let saving = false;
      let dirty = false;

      async function saveProgress() {
        if (!USER_ID) return;
        dirty = true;
        if (saving) return;
        saving = true;
        try {
          while (dirty) {
            dirty = false;
            const data = buildData();
            const { error } = await supabase
              .from("progress")
              .upsert(
                {
                  user_id: USER_ID,
                  subject: SUBJECT,
                  data,
                  updated_at: new Date().toISOString(),
                },
                { onConflict: "user_id,subject" }
              );
            if (error) console.error("Error saving progress:", error.message);
          }
        } finally {
          saving = false;
        }
      }

      async function loadProgress() {
        const { data: row } = await supabase
          .from("progress")
          .select("data")
          .eq("user_id", USER_ID)
          .eq("subject", SUBJECT)
          .maybeSingle();
        if (row?.data && Number.isFinite(row.data.score)) {
          totalScore = row.data.score;
        } else {
          totalScore = 0;
        }
        sessionScore = 0;
        streak = 0;
        updateScoreboard();
      }

      function renderLessons() {
        const root = $("lessons");
        root.innerHTML = "";
        const lessons = window.MATH_LESSONS;
        if (!Array.isArray(lessons) || !lessons.length) {
          root.innerHTML =
            '<p style="text-align:center;color:var(--soft);font-weight:700">No lessons loaded.</p>';
          return;
        }
        for (const lesson of lessons) {
          const el = document.createElement("article");
          el.className = "lesson";
          const sections = (lesson.sections || [])
            .map(
              (s) =>
                `<div class="sec"><h3>${escapeHtml(s.h)}</h3><p>${escapeHtml(s.body)}</p></div>`
            )
            .join("");
          el.innerHTML = `
            <span class="num">Lesson ${escapeHtml(lesson.num ?? lesson.id)}</span>
            <h2>${escapeHtml(lesson.title)}</h2>
            <p class="sub">${escapeHtml(lesson.subtitle || "")}</p>
            <p class="intro">${escapeHtml(lesson.intro || "")}</p>
            ${sections}
            ${lesson.recuerda ? `<div class="recuerda">${escapeHtml(lesson.recuerda)}</div>` : ""}
          `;
          root.appendChild(el);
        }
      }

      function itemKey(mech, idx) {
        return `${mech}:${idx}`;
      }

      function pickRound() {
        const bank = window.MATH_BANK;
        if (!bank) return null;

        for (let attempt = 0; attempt < 30; attempt++) {
          const mech =
            MECHANICS[Math.floor(Math.random() * MECHANICS.length)];
          const pool = bank[mech];
          if (!Array.isArray(pool) || !pool.length) continue;

          const idx = Math.floor(Math.random() * pool.length);
          const key = itemKey(mech, idx);
          if (key === lastItemKey && pool.length > 1) continue;

          lastItemKey = key;
          return { mech, item: pool[idx], idx };
        }
        return null;
      }

      function showRoundInstruction(mech, item) {
        const el = $("round-instruction");
        const text = item?.ask || window.MATH_UI?.[mech];
        if (text) {
          el.textContent = text;
          el.hidden = false;
        } else {
          el.hidden = true;
        }
      }

      function showFeedback(ok, html) {
        const fb = $("feedback");
        fb.className = `feedback show ${ok ? "good" : "bad"}`;
        fb.innerHTML = html;
      }

      function awardCorrect() {
        let gained = 10;
        streak += 1;
        if (streak > 0 && streak % 3 === 0) gained += 5;
        sessionScore += gained;
        totalScore += gained;
        updateScoreboard();
        saveProgress();
      }

      function breakStreak() {
        streak = 0;
        updateScoreboard();
      }

      function scheduleNext() {
        setTimeout(() => {
          answering = false;
          startRound();
        }, ADVANCE_MS);
      }

      function finishAnswer(ok, item, pickedEl) {
        if (answering) return;
        answering = true;
        if (pickedEl) pickedEl.classList.add(ok ? "correct" : "wrong");
        $("interaction").querySelectorAll("button").forEach((b) => {
          b.disabled = true;
        });
        const input = $("typed-input");
        if (input) input.disabled = true;

        if (ok) {
          awardCorrect();
          showFeedback(true, `Correct! +points<br>${escapeHtml(item.why || "")}`);
        } else {
          breakStreak();
          let msg = `Not quite.<br>${escapeHtml(item.why || "")}`;
          if (item.answer != null && (currentRound?.mech === "type" || currentRound?.mech === "array")) {
            msg += `<br>The answer is <b>${escapeHtml(item.answer)}</b>.`;
          }
          showFeedback(false, msg);
        }
        scheduleNext();
      }

      function renderTyped(item) {
        $("prompt").textContent = item.q || "";
        const wrap = $("interaction");
        const maxLen = Math.max(String(item.answer ?? "").length, 2);
        wrap.innerHTML = `
          <div class="typed-row">
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              class="num-input"
              id="typed-input"
              autocomplete="off"
              spellcheck="false"
              maxlength="${maxLen + 1}"
              aria-label="Your number answer"
            />
            <button type="button" class="btn" id="typed-submit">Check</button>
          </div>
        `;
        const input = $("typed-input");
        const submit = $("typed-submit");
        const check = () => {
          if (answering) return;
          const raw = input.value.trim();
          if (!raw) return;
          const ok = raw === String(item.answer);
          finishAnswer(ok, item);
        };
        submit.addEventListener("click", check);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") check();
        });
        input.focus();
      }

      function renderCompare(item) {
        $("prompt").innerHTML = `
          <div class="compare-row">
            <span class="compare-val">${escapeHtml(item.left)}</span>
            <span class="compare-gap">?</span>
            <span class="compare-val">${escapeHtml(item.right)}</span>
          </div>
        `;
        const wrap = $("interaction");
        wrap.innerHTML = '<div class="symbol-row" id="symbol-row"></div>';
        const row = $("symbol-row");
        [">", "<", "="].forEach((sym) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "symbol-btn";
          btn.textContent = sym;
          btn.addEventListener("click", () => {
            finishAnswer(sym === item.answer, item, btn);
          });
          row.appendChild(btn);
        });
      }

      function renderOptions(item) {
        $("prompt").textContent = item.q || "";
        const wrap = $("interaction");
        wrap.innerHTML = "";
        (item.options || []).forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt-btn";
          btn.textContent = opt;
          btn.addEventListener("click", () => {
            finishAnswer(i === item.answer, item, btn);
          });
          wrap.appendChild(btn);
        });
      }

      function startRound() {
        currentRound = pickRound();
        $("feedback").className = "feedback";
        $("feedback").innerHTML = "";
        $("round-instruction").hidden = true;
        $("prompt").innerHTML = "";
        $("interaction").innerHTML = "";

        if (!currentRound) {
          $("mech-tag").textContent = "No questions";
          $("prompt").textContent = "Question bank not loaded yet.";
          return;
        }

        const { mech, item } = currentRound;
        $("mech-tag").textContent = MECH_LABELS[mech] || mech;
        showRoundInstruction(mech, item);

        if (mech === "type" || mech === "array") renderTyped(item);
        else if (mech === "compare") renderCompare(item);
        else renderOptions(item);
      }

      function setupTabs() {
        const tabStudy = $("tab-study");
        const tabPlay = $("tab-play");
        const panelStudy = $("panel-study");
        const panelPlay = $("panel-play");

        tabStudy.addEventListener("click", () => {
          tabStudy.classList.add("active");
          tabPlay.classList.remove("active");
          tabStudy.setAttribute("aria-selected", "true");
          tabPlay.setAttribute("aria-selected", "false");
          panelStudy.classList.add("on");
          panelStudy.hidden = false;
          panelPlay.classList.remove("on");
          panelPlay.hidden = true;
        });

        tabPlay.addEventListener("click", () => {
          tabPlay.classList.add("active");
          tabStudy.classList.remove("active");
          tabPlay.setAttribute("aria-selected", "true");
          tabStudy.setAttribute("aria-selected", "false");
          panelPlay.classList.add("on");
          panelPlay.hidden = false;
          panelStudy.classList.remove("on");
          panelStudy.hidden = true;
          if (!answering && !currentRound) startRound();
        });
      }

      function setupAuthListener(uid) {
        supabase.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_OUT" || !session) {
            window.location.replace("../index.html");
            return;
          }
          if (session.user.id !== uid) {
            window.location.replace("../redwood-login.html");
          }
        });
      }

      (async () => {
        const {
          data: { user },
          error,
        } = await supabase.auth.getUser();
        if (error || !user) {
          window.location.replace("../redwood-login.html");
          return;
        }
        USER_ID = user.id;

        const { data: profile } = await supabase
          .from("profiles")
          .select("has_access")
          .eq("id", USER_ID)
          .single();

        if (profile?.has_access !== true) {
          window.location.replace("../dashboard.html");
          return;
        }

        await loadProgress();
        renderLessons();
        setupTabs();
        $("scorebar").hidden = false;

        $("loading").hidden = true;
        $("app").hidden = false;

        setupAuthListener(USER_ID);
      })();
    </script>
  </body>
</html>
