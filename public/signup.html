<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta · My eTutor</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <style>
      .auth-wrap{max-width:440px}
      .auth-brand{text-align:center;margin-bottom:18px}
      .auth-brand .t{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--navy);font-size:1.5rem}
      .auth-brand .t span{color:var(--blue)}
      .auth-brand .s{font-size:.72rem;letter-spacing:.14em;color:var(--blue);font-weight:800;text-transform:uppercase}
      .auth-card h1{font-size:1.35rem;color:var(--navy);text-align:center;margin-bottom:4px}
      .auth-card .subtitle{color:var(--soft);text-align:center;font-weight:700;margin-bottom:18px}
      .alt-link{margin-top:18px;text-align:center;color:var(--soft);font-weight:700;font-size:.92rem}
      .alt-link a{color:var(--blue);font-weight:800;text-decoration:none}
      .alt-link a:hover{text-decoration:underline}
      .btn.primary{width:100%}
      #message{margin-top:0;margin-bottom:16px}
    </style>
  </head>
  <body>
    <div class="wrap auth-wrap">
      <div class="auth-brand">
        <div class="t">My <span>eTutor</span></div>
        <div class="s">Aprende jugando</div>
      </div>

      <div class="card auth-card">
        <h1>Crear cuenta</h1>
        <p class="subtitle">Regístrate para empezar a estudiar.</p>

        <div id="message" class="feedback" role="alert" hidden>
          <div class="fh" id="message-title"></div>
          <div id="message-text"></div>
        </div>

        <form id="signup-form" class="form" novalidate>
          <div class="field">
            <label for="kid_name">Nombre del estudiante</label>
            <input
              class="input"
              type="text"
              id="kid_name"
              name="kid_name"
              placeholder="Ej. Sofía"
              autocomplete="name"
              required
            />
          </div>

          <div class="field">
            <label for="parent_email">Correo del padre o madre</label>
            <input
              class="input"
              type="email"
              id="parent_email"
              name="parent_email"
              placeholder="correo@ejemplo.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="field">
            <label for="confirm_password">Confirmar contraseña</label>
            <input
              class="input"
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Repite la contraseña"
              autocomplete="new-password"
              required
            />
          </div>

          <button type="submit" class="btn primary" id="submit-btn">
            Crear cuenta
          </button>
        </form>

        <p class="alt-link">
          ¿Ya tienes cuenta? <a href="./login.html">Inicia sesión</a>
        </p>
      </div>
    </div>

    <script type="module">
      import { supabase } from "./js/supabase.js";

      const form = document.getElementById("signup-form");
      const messageEl = document.getElementById("message");
      const messageTitle = document.getElementById("message-title");
      const messageText = document.getElementById("message-text");
      const submitBtn = document.getElementById("submit-btn");

      // Si ya hay sesión activa, ir directo al panel.
      (async () => {
        const {
          data: { session },
        } = await supabase.auth.getSession();
        if (session) window.location.replace("./dashboard.html");
      })();

      function showMessage(text, type) {
        // type: "good" o "bad" (clases del tema)
        messageEl.className = `feedback ${type}`;
        messageEl.hidden = false;
        messageTitle.textContent = type === "good" ? "¡Listo!" : "Atención";
        messageText.textContent = text;
      }

      function hideMessage() {
        messageEl.hidden = true;
        messageEl.className = "feedback";
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessage();

        const kidName = form.kid_name.value.trim();
        const parentEmail = form.parent_email.value.trim();
        const password = form.password.value;
        const confirmPassword = form.confirm_password.value;

        if (!kidName || !parentEmail || !password || !confirmPassword) {
          showMessage("Por favor completa todos los campos.", "bad");
          return;
        }
        if (!isValidEmail(parentEmail)) {
          showMessage("Ingresa un correo electrónico válido.", "bad");
          return;
        }
        if (password.length < 6) {
          showMessage("La contraseña debe tener al menos 6 caracteres.", "bad");
          return;
        }
        if (password !== confirmPassword) {
          showMessage("Las contraseñas no coinciden.", "bad");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creando cuenta...";

        const { data, error } = await supabase.auth.signUp({
          email: parentEmail,
          password,
          options: {
            data: { kid_name: kidName, parent_email: parentEmail },
          },
        });

        if (error) {
          let msg = "No se pudo crear la cuenta. Inténtalo de nuevo.";
          if (
            error.message?.toLowerCase().includes("already") ||
            error.message?.toLowerCase().includes("registered")
          ) {
            msg = "Ya existe una cuenta con ese correo. Inicia sesión.";
          }
          showMessage(msg, "bad");
          submitBtn.disabled = false;
          submitBtn.textContent = "Crear cuenta";
          return;
        }

        // Si Supabase devuelve sesión, entrar directo al panel.
        if (data.session) {
          window.location.replace("./dashboard.html");
          return;
        }

        // Si no hay sesión, mostrar éxito y enviar a iniciar sesión.
        showMessage(
          "¡Cuenta creada con éxito! Te llevaremos a iniciar sesión...",
          "good"
        );
        setTimeout(() => window.location.replace("./login.html"), 1800);
      });
    </script>
  </body>
</html>
