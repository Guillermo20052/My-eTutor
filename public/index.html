<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My eTutor</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <style>
      /* Author display:flex beats UA [hidden]{display:none} — force hide. */
      .loader[hidden],
      .picker-wrap[hidden]{display:none !important}

      .loader,
      .picker-wrap{
        min-height:70vh;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;text-align:center;
      }
      .loader{gap:16px}
      .loader .brand{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--navy);font-size:1.6rem}
      .loader .brand span{color:var(--blue)}
      .loader .msg{color:var(--soft);font-weight:800;font-size:1rem}
      .spinner{
        width:38px;height:38px;border-radius:50%;
        border:4px solid var(--line);border-top-color:var(--blue);
        animation:spin .8s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg)}}

      .picker-wrap{max-width:480px;margin:0 auto;width:100%}
      .picker-brand{text-align:center;margin-bottom:28px}
      .picker-brand .t{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--navy);font-size:1.6rem}
      .picker-brand .t span{color:var(--blue)}
      .picker-welcome{
        text-align:center;color:var(--soft);font-weight:700;font-size:1rem;
        margin-bottom:22px;line-height:1.5;
      }
      .picker-welcome em{font-style:normal;color:var(--ink);font-weight:800}
      .picker-grid{display:flex;flex-direction:column;gap:14px;width:100%}
      .school-btn{
        display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;
        border-radius:18px;border:2px solid var(--line);background:#fff;
        text-decoration:none;color:inherit;cursor:pointer;
        box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s,transform .15s;
      }
      .school-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
      .school-btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
      .school-btn .ic{
        flex:none;width:48px;height:48px;border-radius:14px;
        display:grid;place-items:center;font-size:1.4rem;font-weight:800;
      }
      .school-btn .meta{text-align:left}
      .school-btn .name{
        font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.15rem;
        color:var(--navy);margin-bottom:2px;
      }
      .school-btn .desc{color:var(--soft);font-weight:700;font-size:.88rem}
      .school-btn.blueridge:hover{border-color:var(--blue)}
      .school-btn.blueridge .ic{background:var(--sky);color:var(--blue-d)}
      .school-btn.redwood:hover{border-color:#a63d3d}
      .school-btn.redwood .ic{background:#fde8e4;color:#8b2e2e}
      .school-btn.redwood .name span{color:#a63d3d}

      .continue-wrap{margin-bottom:20px;width:100%}
      .continue-btn{
        display:block;width:100%;padding:16px 20px;border-radius:18px;
        border:2px solid var(--blue);background:var(--sky);
        font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.12rem;
        color:var(--navy);text-align:center;text-decoration:none;
        box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;
      }
      .continue-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
      .continue-btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
      .continue-btn.redwood{border-color:#a63d3d;background:#fde8e4;color:#8b2e2e}
      .picker-or{
        text-align:center;color:var(--soft);font-weight:700;font-size:.9rem;
        margin-bottom:16px;line-height:1.4;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="loader" class="loader">
        <div class="brand">My <span>eTutor</span></div>
        <div class="spinner" aria-hidden="true"></div>
        <div class="msg">Cargando...</div>
      </div>

      <div id="picker" class="picker-wrap" hidden>
        <div class="picker-brand">
          <div class="t">My <span>eTutor</span></div>
        </div>
        <p class="picker-welcome">
          <em>Elige tu escuela</em> · Choose your school
        </p>
        <div id="continue-wrap" class="continue-wrap" hidden>
          <a id="continue-btn" class="continue-btn" href="./dashboard.html"></a>
        </div>
        <p id="picker-or" class="picker-or" hidden>o elige otra escuela · or pick another school</p>
        <div class="picker-grid">
          <a class="school-btn blueridge" href="./login.html">
            <span class="ic" aria-hidden="true">🏔️</span>
            <span class="meta">
              <div class="name">Blueridge</div>
              <div class="desc">Continúa con tu cuenta actual</div>
            </span>
          </a>
          <a class="school-btn redwood" href="./redwood-login.html">
            <span class="ic" aria-hidden="true">🌲</span>
            <span class="meta">
              <div class="name"><span>Redwood</span></div>
              <div class="desc">Entrada para estudiantes de Redwood</div>
            </span>
          </a>
        </div>
      </div>
    </div>

    <script type="module">
      import { supabase } from "./js/supabase.js";

      const loader = document.getElementById("loader");
      const picker = document.getElementById("picker");
      const continueWrap = document.getElementById("continue-wrap");
      const continueBtn = document.getElementById("continue-btn");
      const pickerOr = document.getElementById("picker-or");

      function showPicker(opts = {}) {
        loader.hidden = true;
        picker.hidden = false;
        if (opts.school === "redwood") {
          continueBtn.textContent = "Continuar como Redwood";
          continueBtn.classList.add("redwood");
          continueWrap.hidden = false;
          pickerOr.hidden = false;
        } else if (opts.school === "blueridge") {
          continueBtn.textContent = "Continuar como Blueridge";
          continueBtn.classList.remove("redwood");
          continueWrap.hidden = false;
          pickerOr.hidden = false;
        }
      }

      (async () => {
        try {
          // Validar contra el servidor (no confiar solo en la sesión en caché).
          const {
            data: { user },
            error,
          } = await supabase.auth.getUser();
          if (!error && user) {
            const { data: profile } = await supabase
              .from("profiles")
              .select("school")
              .eq("id", user.id)
              .single();
            const school =
              profile?.school === "redwood" ? "redwood" : "blueridge";
            showPicker({ school });
            return;
          }
          showPicker();
        } catch (e) {
          showPicker();
        }
      })();
    </script>
  </body>
</html>
