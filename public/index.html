<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My eTutor</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <style>
      .loader{
        min-height:70vh;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;text-align:center;
      }
      .loader .brand{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--navy);font-size:1.6rem}
      .loader .brand span{color:var(--blue)}
      .loader .msg{color:var(--soft);font-weight:800;font-size:1rem}
      .spinner{
        width:38px;height:38px;border-radius:50%;
        border:4px solid var(--line);border-top-color:var(--blue);
        animation:spin .8s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="loader">
        <div class="brand">My <span>eTutor</span></div>
        <div class="spinner" aria-hidden="true"></div>
        <div class="msg">Cargando...</div>
      </div>
    </div>

    <script type="module">
      import { supabase } from "./js/supabase.js";

      (async () => {
        try {
          const {
            data: { session },
          } = await supabase.auth.getSession();
          window.location.replace(session ? "./dashboard.html" : "./login.html");
        } catch (e) {
          // Si algo falla al verificar la sesión, ir a iniciar sesión.
          window.location.replace("./login.html");
        }
      })();
    </script>
  </body>
</html>
