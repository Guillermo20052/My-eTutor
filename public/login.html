<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión · My eTutor</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <style>
      .auth-wrap{max-width:440px}
      .auth-brand{text-align:center;margin-bottom:18px}
      .auth-brand .t{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--navy);font-size:1.5rem}
      .auth-brand .t span{color:var(--blue)}
      .auth-brand .s{font-size:.72rem;letter-spacing:.14em;color:var(--blue);font-weight:800;text-transform:uppercase}
      .auth-card h1{font-size:1.35rem;color:var(--navy);text-align:center;margin-bottom:4px}
      .auth-card .subtitle{color:var(--soft);text-align:center;font-weight:700;margin-bottom:18px}
      .alt-link{margin-top:18px;text-align:center;color:var(--soft);font-weight:700;font-size:.92rem}
      .alt-link a{color:var(--blue);font-weight:800;text-decoration:none}
      .alt-link a:hover{text-decoration:underline}
      .btn.primary{width:100%}
      #message{margin-top:0;margin-bottom:16px}
    </style>
  </head>
  <body>
    <div class="wrap auth-wrap">
      <div class="auth-brand">
        <div class="t">My <span>eTutor</span></div>
        <div class="s">Aprende jugando</div>
      </div>

      <div class="card auth-card">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Bienvenido de nuevo.</p>

        <div id="message" class="feedback" role="alert" hidden>
          <div class="fh" id="message-title"></div>
          <div id="message-text"></div>
        </div>

        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label for="email">Correo</label>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              placeholder="correo@ejemplo.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              placeholder="Tu contraseña"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="btn primary" id="submit-btn">
            Iniciar sesión
          </button>
        </form>

        <p class="alt-link">
          ¿No tienes cuenta? <a href="./signup.html">Regístrate</a>
        </p>
      </div>
    </div>

    <script type="module">
      import { supabase } from "./js/supabase.js";

      const form = document.getElementById("login-form");
      const messageEl = document.getElementById("message");
      const messageTitle = document.getElementById("message-title");
      const messageText = document.getElementById("message-text");
      const submitBtn = document.getElementById("submit-btn");

      // Si ya hay sesión activa, ir directo al panel.
      (async () => {
        const {
          data: { session },
        } = await supabase.auth.getSession();
        if (session) window.location.replace("./dashboard.html");
      })();

      function showMessage(text, type) {
        // type: "good" o "bad" (clases del tema)
        messageEl.className = `feedback ${type}`;
        messageEl.hidden = false;
        messageTitle.textContent = type === "good" ? "¡Listo!" : "Atención";
        messageText.textContent = text;
      }

      function hideMessage() {
        messageEl.hidden = true;
        messageEl.className = "feedback";
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessage();

        const email = form.email.value.trim();
        const password = form.password.value;

        if (!email || !password) {
          showMessage("Por favor ingresa tu correo y contraseña.", "bad");
          return;
        }
        if (!isValidEmail(email)) {
          showMessage("Ingresa un correo electrónico válido.", "bad");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Entrando...";

        const { error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          showMessage(
            "Correo o contraseña incorrectos. Inténtalo de nuevo.",
            "bad"
          );
          submitBtn.disabled = false;
          submitBtn.textContent = "Iniciar sesión";
          return;
        }

        window.location.replace("./dashboard.html");
      });
    </script>
  </body>
</html>
