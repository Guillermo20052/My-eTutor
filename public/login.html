<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión · My eTutor</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <style>
      .auth-wrap{max-width:440px}
      .auth-brand{text-align:center;margin-bottom:18px}
      .auth-brand .t{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--navy);font-size:1.5rem}
      .auth-brand .t span{color:var(--blue)}
      .auth-brand .s{font-size:.72rem;letter-spacing:.14em;color:var(--blue);font-weight:800;text-transform:uppercase}
      .auth-card h1{font-size:1.35rem;color:var(--navy);text-align:center;margin-bottom:4px}
      .auth-card .subtitle{color:var(--soft);text-align:center;font-weight:700;margin-bottom:18px}
      .alt-link{margin-top:18px;text-align:center;color:var(--soft);font-weight:700;font-size:.92rem}
      .alt-link a{color:var(--blue);font-weight:800;text-decoration:none}
      .alt-link a:hover{text-decoration:underline}
      .btn.primary{width:100%}
      #message{margin-top:0;margin-bottom:16px}

      /* Mostrar/ocultar contraseña */
      .pw-wrap{position:relative;display:flex;align-items:center}
      .pw-wrap .input{flex:1;padding-right:46px}
      .pw-toggle{
        position:absolute;right:6px;top:50%;transform:translateY(-50%);
        display:grid;place-items:center;width:34px;height:34px;padding:0;
        background:transparent;border:0;border-radius:8px;cursor:pointer;
        color:var(--soft);transition:color .15s;
      }
      .pw-toggle:hover{color:var(--blue)}
      .pw-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
      .pw-toggle svg{width:20px;height:20px;display:block}
    </style>
  </head>
  <body>
    <div class="wrap auth-wrap">
      <div class="auth-brand">
        <div class="t">My <span>eTutor</span></div>
        <div class="s">Aprende jugando</div>
      </div>

      <div class="card auth-card">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Bienvenido de nuevo.</p>

        <div id="message" class="feedback" role="alert" hidden>
          <div class="fh" id="message-title"></div>
          <div id="message-text"></div>
        </div>

        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label for="email">Correo</label>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              placeholder="correo@ejemplo.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <div class="pw-wrap">
              <input
                class="input"
                type="password"
                id="password"
                name="password"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="pw-toggle"
                aria-label="Mostrar contraseña"
                aria-pressed="false"
              ></button>
            </div>
          </div>

          <button type="submit" class="btn primary" id="submit-btn">
            Iniciar sesión
          </button>
        </form>

        <p class="alt-link">
          ¿No tienes cuenta? <a href="./signup.html">Regístrate</a>
        </p>
      </div>
    </div>

    <script type="module">
      import { supabase } from "./js/supabase.js";

      // Mostrar/ocultar contraseña: aplica a todos los .pw-toggle de la página.
      const EYE_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
      const EYE_OFF_SVG =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

      for (const btn of document.querySelectorAll(".pw-toggle")) {
        const input = btn.closest(".pw-wrap")?.querySelector("input");
        if (!input) continue;
        btn.innerHTML = EYE_SVG;
        btn.addEventListener("click", () => {
          const show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.innerHTML = show ? EYE_OFF_SVG : EYE_SVG;
          btn.setAttribute(
            "aria-label",
            show ? "Ocultar contraseña" : "Mostrar contraseña"
          );
          btn.setAttribute("aria-pressed", show ? "true" : "false");
        });
      }

      const form = document.getElementById("login-form");
      const messageEl = document.getElementById("message");
      const messageTitle = document.getElementById("message-title");
      const messageText = document.getElementById("message-text");
      const submitBtn = document.getElementById("submit-btn");

      // Enviar al panel según el rol (admin -> admin.html, estudiante -> dashboard.html).
      async function routeByRole(userId) {
        const { data: profile } = await supabase
          .from("profiles")
          .select("is_admin")
          .eq("id", userId)
          .single();
        window.location.replace(
          profile?.is_admin === true ? "./admin.html" : "./dashboard.html"
        );
      }

      // Si ya hay sesión activa (validada con el servidor), ir directo al panel por rol.
      (async () => {
        const {
          data: { user },
          error,
        } = await supabase.auth.getUser();
        if (!error && user) await routeByRole(user.id);
      })();

      function showMessage(text, type) {
        // type: "good" o "bad" (clases del tema)
        messageEl.className = `feedback ${type}`;
        messageEl.hidden = false;
        messageTitle.textContent = type === "good" ? "¡Listo!" : "Atención";
        messageText.textContent = text;
      }

      function hideMessage() {
        messageEl.hidden = true;
        messageEl.className = "feedback";
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessage();

        const email = form.email.value.trim();
        const password = form.password.value;

        if (!email || !password) {
          showMessage("Por favor ingresa tu correo y contraseña.", "bad");
          return;
        }
        if (!isValidEmail(email)) {
          showMessage("Ingresa un correo electrónico válido.", "bad");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Entrando...";

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          showMessage(
            "Correo o contraseña incorrectos. Inténtalo de nuevo.",
            "bad"
          );
          submitBtn.disabled = false;
          submitBtn.textContent = "Iniciar sesión";
          return;
        }

        // Enrutar directamente según el rol (sin pasar por el dashboard).
        await routeByRole(data.user.id);
      });
    </script>
  </body>
</html>
