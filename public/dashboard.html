<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel · My eTutor</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <style>
      /* ---------- Dashboard-only layout (not in theme.css) ---------- */
      .player{
        display:flex;align-items:center;gap:10px;background:var(--sky);
        border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:999px;
      }
      .avatar{
        width:34px;height:34px;border-radius:50%;
        background:linear-gradient(145deg,var(--blue),var(--navy));color:#fff;
        display:grid;place-items:center;font-family:'Fredoka';font-weight:700;
        font-size:1.05rem;box-shadow:inset 0 -2px 4px rgba(0,0,0,.2);
      }
      .player{align-items:stretch}
      .pwrap{display:flex;flex-direction:column;justify-content:center;line-height:1.05}
      .player .pn{font-weight:800;color:var(--blue);font-size:.95rem}
      .player .prank{
        font-family:'Fredoka';font-weight:700;font-size:.72rem;color:var(--soft);
        margin-top:1px;display:flex;align-items:center;gap:3px;
      }
      .topbar .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .topbar .btn{font-size:.92rem;padding:9px 16px}

      /* ---------- Top nav tabs ---------- */
      .tabs{
        display:flex;gap:8px;background:var(--card);border:1px solid var(--line);
        border-radius:16px;padding:6px;margin-bottom:18px;box-shadow:var(--shadow-sm);
      }
      .tabs a{
        flex:1;text-align:center;text-decoration:none;font-family:'Fredoka';
        font-weight:600;color:var(--soft);padding:11px 14px;border-radius:11px;
        transition:background .15s,color .15s;font-size:1rem;
      }
      .tabs a.active{
        background:linear-gradient(145deg,var(--blue),var(--blue-d));color:#fff;
        box-shadow:0 6px 14px -8px rgba(21,104,160,.9);
      }
      .tabs a:not(.active):hover{background:var(--sky);color:var(--navy)}

      .hero{text-align:center;margin:8px 0 22px}
      .hero h1{font-size:clamp(1.7rem,5vw,2.6rem);color:var(--navy);font-weight:700;letter-spacing:-.01em}
      .hero h1 .pop{color:var(--blue)}
      .hero p{color:var(--soft);font-weight:700;margin-top:6px;font-size:1.02rem}

      /* Big, game-like subject tiles, centered to fill the page. */
      .grid{
        display:grid;grid-template-columns:repeat(3,1fr);gap:22px;
        max-width:880px;margin:6px auto 0;min-height:52vh;align-content:center;
      }
      .subject{
        text-align:center;cursor:pointer;border-radius:24px;
        min-height:250px;padding:30px 22px 26px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      }
      .subject .ic{
        font-size:4rem;line-height:1;display:block;margin:0 0 8px;
        filter:drop-shadow(0 6px 12px rgba(13,52,92,.18));
        transition:transform .16s ease;
      }
      .subject h3{font-size:1.5rem;color:var(--navy);font-weight:700;line-height:1.12}
      .subject .desc{color:var(--soft);font-weight:700;font-size:.95rem;margin-top:3px}
      .subject .tag{
        display:inline-block;margin-top:16px;font-size:.8rem;font-weight:800;
        color:var(--blue-d);background:var(--sky);padding:6px 14px;border-radius:999px;
        border:1px solid var(--line);
      }
      /* Extra-fun hover lift for kids. */
      .subject:hover{transform:translateY(-8px) scale(1.03)}
      .subject:hover .ic{transform:scale(1.08) rotate(-3deg)}

      /* Locked state: dimmed preview + lock overlay (scaled up for big tiles) */
      .subject.locked .ic,
      .subject.locked h3,
      .subject.locked .desc,
      .subject.locked .tag{opacity:.45;filter:grayscale(.3)}
      .subject.locked::after{
        content:"🔒";position:absolute;top:12px;right:12px;font-size:1.4rem;
        background:#fff;border:1px solid var(--line);border-radius:12px;
        width:40px;height:40px;display:grid;place-items:center;
        box-shadow:var(--shadow-sm);opacity:1;filter:none;
      }
      .subject.locked:hover{transform:none;border-color:var(--line);box-shadow:var(--shadow-sm)}
      .subject.locked:hover .ic{transform:none}

      @media (max-width:680px){
        .grid{grid-template-columns:1fr;gap:18px;max-width:440px;min-height:0}
        .subject{min-height:200px}
      }

      .loader{
        min-height:70vh;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;text-align:center;
      }
      .loader .brand{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--navy);font-size:1.6rem}
      .loader .brand span{color:var(--blue)}
      .loader .msg{color:var(--soft);font-weight:800}
      .spinner{
        width:38px;height:38px;border-radius:50%;
        border:4px solid var(--line);border-top-color:var(--blue);
        animation:spin .8s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg)}}

      .modalbox .hint{font-size:.85rem;color:var(--soft);font-weight:700;margin-top:14px}
      .payinfo{
        background:var(--sky);border:1px dashed var(--line);border-radius:14px;
        padding:14px 16px;color:var(--ink);font-weight:700;text-align:left;
      }
    </style>
  </head>
  <body>
    <!-- Loading state (shown until session + profile are resolved) -->
    <div class="wrap" id="loading">
      <div class="loader">
        <div class="brand">My <span>eTutor</span></div>
        <div class="spinner" aria-hidden="true"></div>
        <div class="msg">Cargando...</div>
      </div>
    </div>

    <!-- App (revealed after data loads) -->
    <div class="wrap" id="app" hidden>
      <header class="topbar">
        <div class="brandtxt">
          <div class="t">My eTutor</div>
          <div class="s">Aprende jugando</div>
        </div>
        <div class="right">
          <div class="player">
            <div class="avatar" id="avatar">?</div>
            <div class="pwrap">
              <div class="pn" id="player-name">Estudiante</div>
              <div class="prank" id="player-rank" hidden></div>
            </div>
          </div>
          <button class="btn ghost" id="logout-btn">Cerrar sesión</button>
        </div>
      </header>

      <!-- Top nav: study (here) + leaderboard -->
      <nav class="tabs">
        <a href="./dashboard.html" class="active" aria-current="page">📚 Estudiar</a>
        <a href="./leaderboard.html">🏆 Tabla de Posiciones</a>
      </nav>

      <section class="hero">
        <h1 id="greeting">¡Hola!</h1>
        <p>Elige una materia para estudiar jugando.</p>
      </section>

      <section class="grid" id="subjects"></section>
    </div>

    <!-- Locked modal -->
    <div class="modal" id="locked-modal">
      <div class="modalbox">
        <div class="mi">🔒</div>
        <h3>¿Cómo obtengo acceso?</h3>
        <div class="payinfo">
          <!-- ===== PAYMENT INSTRUCTIONS — EDIT THIS LATER ===== -->
          (TODO: payment text goes here)
          <!-- ===== END PAYMENT INSTRUCTIONS ===== -->
        </div>
        <p class="hint">Actualiza la página después de obtener acceso.</p>
        <div class="mbtns">
          <button class="btn ghost" id="close-modal">Cerrar</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { supabase } from "./js/supabase.js";

      // Adding a subject later = one line in this array.
      const SUBJECTS = [
        { id: "religion",    name: "Religión",    icon: "✝️", accent: "#7C3AED", free: true,  desc: "Los sacramentos"  },
        { id: "matematicas", name: "Matemáticas", icon: "🔢", accent: "#1f8fd0", free: false, desc: "Practica y juega"  },
        { id: "ingles",      name: "Inglés",      icon: "🔤", accent: "#0E9F6E", free: false, desc: "Practice English" },
        { id: "historia",    name: "Historia",    icon: "🏛️", accent: "#9C6B30", free: false, desc: "La Revolución Mexicana" },
        { id: "espanol",     name: "Español",     icon: "📖", accent: "#E8633F", free: false, desc: "Historieta, adverbios y más" },
        { id: "musica",      name: "Música",      icon: "🎵", accent: "#7C3AED", free: false, desc: "Lee y nombra las notas" },
        { id: "ciencias",    name: "Science",     icon: "🔬", accent: "#16A98C", free: false, desc: "Ecosystems, space and more" },
      ];

      const loadingEl = document.getElementById("loading");
      const appEl = document.getElementById("app");
      const subjectsEl = document.getElementById("subjects");
      const modalEl = document.getElementById("locked-modal");

      function openModal() {
        modalEl.classList.add("on");
      }
      function closeModal() {
        modalEl.classList.remove("on");
      }
      document.getElementById("close-modal").addEventListener("click", closeModal);
      modalEl.addEventListener("click", (e) => {
        if (e.target === modalEl) closeModal();
      });

      document.getElementById("logout-btn").addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.replace("./login.html");
      });

      function renderSubjects(hasAccess) {
        subjectsEl.innerHTML = "";
        for (const subj of SUBJECTS) {
          // A card is UNLOCKED if the subject is free OR the user has access.
          const unlocked = subj.free === true || hasAccess === true;

          const card = document.createElement("div");
          card.className = "card subject" + (unlocked ? "" : " locked");
          card.style.setProperty("--ac", subj.accent);
          card.innerHTML = `
            <span class="ic">${subj.icon}</span>
            <h3>${subj.name}</h3>
            ${subj.desc ? `<span class="desc">${subj.desc}</span>` : ""}
            <span class="tag">${subj.free ? "Gratis" : unlocked ? "Disponible" : "Bloqueado"}</span>
          `;

          if (unlocked) {
            card.addEventListener("click", () => {
              window.location.href = `./games/${subj.id}.html`;
            });
          } else {
            // Locked: clicking does NOT navigate, it opens the modal.
            card.addEventListener("click", openModal);
          }

          subjectsEl.appendChild(card);
        }
      }

      // Shared rank -> medal + name color mapping (gold/silver/bronze/blue).
      // Used for the header pill here and mirrored on leaderboard.html.
      function rankMeta(rank) {
        if (rank === 1) return { medal: "🥇", color: "#E0A100" }; // gold
        if (rank === 2) return { medal: "🥈", color: "#7D8896" }; // silver
        if (rank === 3) return { medal: "🥉", color: "#B5742E" }; // bronze
        return { medal: "", color: "#1f8fd0" }; // theme --blue
      }

      // Apply the rank treatment to the header pill. rank == null -> plain
      // blue name, no medal, no chip.
      function applyHeaderRank(rank) {
        const nameEl = document.getElementById("player-name");
        const chipEl = document.getElementById("player-rank");
        if (rank == null) {
          nameEl.style.color = "#1f8fd0";
          chipEl.hidden = true;
          return;
        }
        const m = rankMeta(rank);
        nameEl.style.color = m.color;
        chipEl.textContent = (m.medal ? m.medal + " " : "") + "#" + rank;
        chipEl.hidden = false;
      }

      // Read ONLY the leaderboard view to find this user's rank. Fails
      // gracefully (name stays blue) and never blocks the dashboard.
      async function loadHeaderRank(userId) {
        try {
          const { data: rows, error } = await supabase
            .from("leaderboard")
            .select("user_id, rank")
            .order("rank", { ascending: true });
          if (error || !Array.isArray(rows)) return;
          const mine = rows.find((r) => r.user_id === userId);
          if (mine && mine.rank != null) applyHeaderRank(mine.rank);
        } catch (_e) {
          // Network/parse failure -> leave the plain blue name in place.
        }
      }

      // Fix A: stale tabs self-correct when the session changes.
      function setupAuthListener(loadedUserId) {
        supabase.auth.onAuthStateChange((event, session) => {
          // Signed out or no session anywhere -> back to login.
          if (event === "SIGNED_OUT" || !session) {
            window.location.replace("./login.html");
            return;
          }
          // Active account changed (switched in another tab) -> clean reload via login.
          if (session.user.id !== loadedUserId) {
            window.location.replace("./login.html");
          }
        });
      }

      (async () => {
        // Fix B: validate against the server; don't trust the cached session.
        const {
          data: { user },
          error: userError,
        } = await supabase.auth.getUser();

        if (userError || !user) {
          window.location.replace("./login.html");
          return;
        }

        const userId = user.id;

        // Fetch this user's profile (kid_name + has_access + is_admin).
        const { data: profile } = await supabase
          .from("profiles")
          .select("kid_name, has_access, is_admin")
          .eq("id", userId)
          .single();

        // Admins never sit on the student dashboard.
        if (profile?.is_admin === true) {
          window.location.replace("./admin.html");
          return;
        }

        const kidName = (profile?.kid_name || "").trim();
        const hasAccess = profile?.has_access === true;

        // Greeting: never render "¡Hola, !"
        document.getElementById("greeting").innerHTML = kidName
          ? `¡Hola, <span class="pop">${kidName}</span>!`
          : "¡Hola!";

        // Player pill (name starts plain blue; rank treatment applied later).
        document.getElementById("player-name").textContent = kidName || "Estudiante";
        document.getElementById("avatar").textContent = kidName
          ? kidName.charAt(0).toUpperCase()
          : "?";
        applyHeaderRank(null);

        renderSubjects(hasAccess);

        loadingEl.hidden = true;
        appEl.hidden = false;

        // Fetch the user's rank for the header without blocking the reveal.
        // (Students only; admins already redirected to admin.html above.)
        loadHeaderRank(userId);

        // Start reacting to session changes only after a successful load.
        setupAuthListener(userId);
      })();
    </script>
  </body>
</html>
