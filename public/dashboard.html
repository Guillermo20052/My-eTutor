<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel · My eTutor</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <style>
      /* ---------- Dashboard-only layout (not in theme.css) ---------- */
      .player{
        display:flex;align-items:center;gap:10px;background:var(--sky);
        border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:999px;
      }
      .avatar{
        width:34px;height:34px;border-radius:50%;
        background:linear-gradient(145deg,var(--blue),var(--navy));color:#fff;
        display:grid;place-items:center;font-family:'Fredoka';font-weight:700;
        font-size:1.05rem;box-shadow:inset 0 -2px 4px rgba(0,0,0,.2);
      }
      .player .pn{font-weight:800;color:var(--navy);font-size:.95rem}
      .topbar .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .topbar .btn{font-size:.92rem;padding:9px 16px}

      .hero{text-align:center;margin:8px 0 22px}
      .hero h1{font-size:clamp(1.7rem,5vw,2.6rem);color:var(--navy);font-weight:700;letter-spacing:-.01em}
      .hero h1 .pop{color:var(--blue)}
      .hero p{color:var(--soft);font-weight:700;margin-top:6px;font-size:1.02rem}

      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
      .subject{text-align:left}
      .subject .ic{font-size:2rem;line-height:1;display:block;margin:4px 0 10px}
      .subject h3{font-size:1.05rem;color:var(--navy);font-weight:600;line-height:1.12}
      .subject .tag{
        display:inline-block;margin-top:10px;font-size:.68rem;font-weight:800;
        color:var(--blue-d);background:var(--sky);padding:3px 8px;border-radius:999px;
      }

      /* Locked state: dimmed preview + lock overlay */
      .subject.locked{cursor:pointer}
      .subject.locked .ic,
      .subject.locked h3,
      .subject.locked .tag{opacity:.45;filter:grayscale(.3)}
      .subject.locked::after{
        content:"🔒";position:absolute;top:10px;right:10px;font-size:1.15rem;
        background:#fff;border:1px solid var(--line);border-radius:10px;
        width:30px;height:30px;display:grid;place-items:center;
        box-shadow:var(--shadow-sm);opacity:1;filter:none;
      }
      .subject.locked:hover{transform:none;border-color:var(--line);box-shadow:var(--shadow-sm)}

      .loader{
        min-height:70vh;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;text-align:center;
      }
      .loader .brand{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--navy);font-size:1.6rem}
      .loader .brand span{color:var(--blue)}
      .loader .msg{color:var(--soft);font-weight:800}
      .spinner{
        width:38px;height:38px;border-radius:50%;
        border:4px solid var(--line);border-top-color:var(--blue);
        animation:spin .8s linear infinite;
      }
      @keyframes spin{to{transform:rotate(360deg)}}

      .modalbox .hint{font-size:.85rem;color:var(--soft);font-weight:700;margin-top:14px}
      .payinfo{
        background:var(--sky);border:1px dashed var(--line);border-radius:14px;
        padding:14px 16px;color:var(--ink);font-weight:700;text-align:left;
      }

      /* ---------- Leaderboard widget ---------- */
      .lb-widget{margin-top:22px}
      .lb-widget .lb-head{
        display:flex;align-items:center;justify-content:space-between;
        gap:10px;flex-wrap:wrap;margin-bottom:12px;
      }
      .lb-widget .lb-title{
        font-family:'Fredoka';font-weight:700;color:var(--navy);font-size:1.2rem;
        display:flex;align-items:center;gap:8px;
      }
      .lb-widget .lb-rank{
        font-weight:900;color:#fff;background:linear-gradient(145deg,var(--blue),var(--blue-d));
        border-radius:999px;padding:6px 14px;font-size:.95rem;white-space:nowrap;
      }
      .lb-top{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
      .lb-row{
        display:flex;align-items:center;gap:10px;background:var(--sky);
        border:1px solid var(--line);border-radius:12px;padding:9px 12px;
      }
      .lb-row .m{font-size:1.3rem;line-height:1;width:26px;text-align:center}
      .lb-row .nm{flex:1;min-width:0;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .lb-row .pt{font-weight:900;color:var(--blue-d);white-space:nowrap}
      .lb-row .pt small{font-weight:800;color:var(--soft);font-size:.66rem;margin-left:3px}
      .lb-row.me{border:2px solid var(--green);background:#effaf4}
      .lb-empty{color:var(--soft);font-weight:800;text-align:center;padding:14px 6px}
      .lb-widget .btn{width:100%;justify-content:center}
    </style>
  </head>
  <body>
    <!-- Loading state (shown until session + profile are resolved) -->
    <div class="wrap" id="loading">
      <div class="loader">
        <div class="brand">My <span>eTutor</span></div>
        <div class="spinner" aria-hidden="true"></div>
        <div class="msg">Cargando...</div>
      </div>
    </div>

    <!-- App (revealed after data loads) -->
    <div class="wrap" id="app" hidden>
      <header class="topbar">
        <div class="brandtxt">
          <div class="t">My eTutor</div>
          <div class="s">Aprende jugando</div>
        </div>
        <div class="right">
          <div class="player">
            <div class="avatar" id="avatar">?</div>
            <div class="pn" id="player-name">Estudiante</div>
          </div>
          <button class="btn ghost" id="logout-btn">Cerrar sesión</button>
        </div>
      </header>

      <section class="hero">
        <h1 id="greeting">¡Hola!</h1>
        <p>Elige una materia para estudiar jugando.</p>
      </section>

      <section class="grid" id="subjects"></section>

      <!-- Leaderboard widget (hidden until/unless it has data) -->
      <section class="card lb-widget" id="lb-widget" hidden style="--ac:var(--gold)">
        <div class="lb-head">
          <div class="lb-title">🏆 Tabla de Posiciones</div>
          <div class="lb-rank" id="lb-rank" hidden></div>
        </div>
        <div class="lb-top" id="lb-top"></div>
        <a class="btn primary" href="./leaderboard.html">Ver tabla completa</a>
      </section>
    </div>

    <!-- Locked modal -->
    <div class="modal" id="locked-modal">
      <div class="modalbox">
        <div class="mi">🔒</div>
        <h3>¿Cómo obtengo acceso?</h3>
        <div class="payinfo">
          <!-- ===== PAYMENT INSTRUCTIONS — EDIT THIS LATER ===== -->
          (TODO: payment text goes here)
          <!-- ===== END PAYMENT INSTRUCTIONS ===== -->
        </div>
        <p class="hint">Actualiza la página después de obtener acceso.</p>
        <div class="mbtns">
          <button class="btn ghost" id="close-modal">Cerrar</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { supabase } from "./js/supabase.js";

      // Adding a subject later = one line in this array.
      const SUBJECTS = [
        { id: "religion",    name: "Religión",    icon: "✝️", accent: "#7C3AED", free: true  },
        { id: "matematicas", name: "Matemáticas", icon: "🔢", accent: "#1f8fd0", free: false },
        { id: "ingles",      name: "Inglés",      icon: "🔤", accent: "#0E9F6E", free: false },
      ];

      const loadingEl = document.getElementById("loading");
      const appEl = document.getElementById("app");
      const subjectsEl = document.getElementById("subjects");
      const modalEl = document.getElementById("locked-modal");

      function openModal() {
        modalEl.classList.add("on");
      }
      function closeModal() {
        modalEl.classList.remove("on");
      }
      document.getElementById("close-modal").addEventListener("click", closeModal);
      modalEl.addEventListener("click", (e) => {
        if (e.target === modalEl) closeModal();
      });

      document.getElementById("logout-btn").addEventListener("click", async () => {
        await supabase.auth.signOut();
        window.location.replace("./login.html");
      });

      function renderSubjects(hasAccess) {
        subjectsEl.innerHTML = "";
        for (const subj of SUBJECTS) {
          // A card is UNLOCKED if the subject is free OR the user has access.
          const unlocked = subj.free === true || hasAccess === true;

          const card = document.createElement("div");
          card.className = "card subject" + (unlocked ? "" : " locked");
          card.style.setProperty("--ac", subj.accent);
          card.innerHTML = `
            <span class="ic">${subj.icon}</span>
            <h3>${subj.name}</h3>
            <span class="tag">${subj.free ? "Gratis" : unlocked ? "Disponible" : "Bloqueado"}</span>
          `;

          if (unlocked) {
            card.addEventListener("click", () => {
              window.location.href = `./games/${subj.id}.html`;
            });
          } else {
            // Locked: clicking does NOT navigate, it opens the modal.
            card.addEventListener("click", openModal);
          }

          subjectsEl.appendChild(card);
        }
      }

      // Leaderboard widget: reads ONLY the safe leaderboard view, and
      // fails closed (stays hidden / shows a gentle message) on any error
      // so it can never break the rest of the dashboard.
      async function loadLeaderboardWidget(userId) {
        const widgetEl = document.getElementById("lb-widget");
        const rankEl = document.getElementById("lb-rank");
        const topEl = document.getElementById("lb-top");
        const medals = { 1: "🥇", 2: "🥈", 3: "🥉" };

        try {
          const { data: rows, error } = await supabase
            .from("leaderboard")
            .select("*")
            .order("rank", { ascending: true });

          if (error || !Array.isArray(rows) || rows.length === 0) {
            // No data yet -> keep the dashboard intact, hide the widget.
            widgetEl.hidden = true;
            return;
          }

          const total = rows.length;
          const mine = rows.find((r) => r.user_id === userId);

          if (mine) {
            rankEl.textContent = `Tu lugar: #${mine.rank} de ${total}`;
            rankEl.hidden = false;
          } else {
            rankEl.hidden = true;
          }

          topEl.innerHTML = "";
          for (const r of rows.slice(0, 3)) {
            const row = document.createElement("div");
            row.className = "lb-row" + (r.user_id === userId ? " me" : "");
            const pts = Number(r.total_points) || 0;
            row.innerHTML = `
              <span class="m">${medals[r.rank] || "🏅"}</span>
              <span class="nm">${escapeHtml(r.display_name)}</span>
              <span class="pt">${pts}<small>pts</small></span>
            `;
            topEl.appendChild(row);
          }

          widgetEl.hidden = false;
        } catch (_e) {
          // Network/parse failure -> never break the dashboard.
          widgetEl.hidden = true;
        }
      }

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      // Fix A: stale tabs self-correct when the session changes.
      function setupAuthListener(loadedUserId) {
        supabase.auth.onAuthStateChange((event, session) => {
          // Signed out or no session anywhere -> back to login.
          if (event === "SIGNED_OUT" || !session) {
            window.location.replace("./login.html");
            return;
          }
          // Active account changed (switched in another tab) -> clean reload via login.
          if (session.user.id !== loadedUserId) {
            window.location.replace("./login.html");
          }
        });
      }

      (async () => {
        // Fix B: validate against the server; don't trust the cached session.
        const {
          data: { user },
          error: userError,
        } = await supabase.auth.getUser();

        if (userError || !user) {
          window.location.replace("./login.html");
          return;
        }

        const userId = user.id;

        // Fetch this user's profile (kid_name + has_access + is_admin).
        const { data: profile } = await supabase
          .from("profiles")
          .select("kid_name, has_access, is_admin")
          .eq("id", userId)
          .single();

        // Admins never sit on the student dashboard.
        if (profile?.is_admin === true) {
          window.location.replace("./admin.html");
          return;
        }

        const kidName = (profile?.kid_name || "").trim();
        const hasAccess = profile?.has_access === true;

        // Greeting: never render "¡Hola, !"
        document.getElementById("greeting").innerHTML = kidName
          ? `¡Hola, <span class="pop">${kidName}</span>!`
          : "¡Hola!";

        // Player pill
        document.getElementById("player-name").textContent = kidName || "Estudiante";
        document.getElementById("avatar").textContent = kidName
          ? kidName.charAt(0).toUpperCase()
          : "?";

        renderSubjects(hasAccess);

        loadingEl.hidden = true;
        appEl.hidden = false;

        // Load the leaderboard widget without blocking the dashboard reveal.
        // (Students only; admins already redirected to admin.html above.)
        loadLeaderboardWidget(userId);

        // Start reacting to session changes only after a successful load.
        setupAuthListener(userId);
      })();
    </script>
  </body>
</html>
